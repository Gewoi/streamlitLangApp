id: 15_the_accusative_case
title: "🫵 The Accusative Case"
description: "Learn about what the accusative case is, how and when it is used, and realize that Bärndütsch does it in a simpler way than Hochdütsch. In addition: The verb *to see*."
estimated_minutes: 5
section: Simple Concepts

steps:
  - type: markdown
    id: markdown_0
    markdown: |
      ## Cases: Nominative and Accusative
      
      If you already know some Hochdütsch, you might know that it has different *cases*. This is a grammatical concept that English also has somewhat: You don't say *I see he*, but rather ***I see him***. This is already an example of the *accusative* case!
      
      #### Nominative: Who *takes* the action?
      
      So far you've seen nouns and pronouns in the *nominative* case; this is the one you'll find in dictionaries too. It describes who *takes* an action in the sentence:
      
      - **Ds Huus**, **D Frou**, ... **isch**  ...
      - **I mache öppis**
      
      This is the one you'll always learn first. A simple rule of thumb: If, in your sentence, something or someone is ***taking* an action** (*actively* or just *describing* what it is and what it looks like), then you use the **nominative** case!
      
      - **Är isch gross** (**Är** is nominative, we're describing him!)
      - **Si macht öppis** (**Si** is nominative, she is *taking an action*)
      
    images:
      - "data/assets/images/board_names.jpg"

  - type: markdown
    id: markdown_1
    markdown: |
      ## Accusative: Who "*receives*" the action?
      
      Let's take the example from before: You don't say *I see he*, but rather ***I see him***.
      
      In Bärndütsch, you would say **I gseh *ihn*** (and NOT **I gseh är**). **Är** is sort of the *receiver* of the action, in some sense the *target* of it. **That's when we use the accusative: *ihn***. Same with **I gseh ds Huus**: **ds Huus** *receives* the action (or is the *target* of it*), and is therefore in the **accusative**. 
      
      You might have just thought "But that looks exactly the same as the nomiative case right?". And you're right: In Bärndütsch, *articles and nouns *don't change* in the accusative*! That's already a whole lot simpler.
      
    images:
      - "data/assets/images/house_grass.jpg"

  - type: introduce_word
    id: introduce_word_2
    word: "I gseh ä Straas."
    translation:
      en: "I see a street."
      de: "Ich sehe eine Strasse."
    images:
      - "data/assets/images/view_big_building.jpg"
    audio: "data/assets/audio/igsehestraas.mp3"

  - type: order
    id: order_3
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "I see the train station."
      helper: "Ich sehe den Bahnhof."
    tokens: ["I", "gseh", "dr", "Bahnhof."]
    solution_display: |
      ✅ Correct!
      
      In Bärndütsch, *articles* and *nouns* **do not change in the accusative**. This is different than Hochdütsch, where we would now say *den Bahnhof* instead of *der Bahnhof*. Bärndütsch makes this a bit easier!
    audio: "data/assets/audio/igsehdrbahnhof.mp3"

  - type: markdown
    id: markdown_4
    markdown: |
      ## Personal pronouns in the accusative
      
      What does change however are the personal pronouns. Again, same as English: You don't say *she sees I*, but rather *she sees me*. In Bärndütsch, we would say **si gseht *mi***.
      
      Here's a list of all of the singular ones:
      
      <center>
      
      | singular | **sing. acc.**| *Example* |
      | --- | --- | --- |
      | I /Ig | **mi** | **Du gsehsch *mi*** (*you see me*) |
      | Du | **di** | **I gseh *di*** (*I see you*) |
      | Är | **ne / ihn** | **Si gseht *ne / ihn*** (*she sees him*) |
      | Si | **se / si** | **Är gseht *se / si*** (*he sees her*) |
      | Äs | **s** | **I gseh *s*** or **I *gseh's*** (*I see it*) |
      
      </center>
      
      Very commonly, you'll use **ne** or **se** for *him* or *her*.
      
      - **I gseh ne** (*I see him*)
      - **Du gsehsch se** (*You see her*)
    images:
      - "data/assets/images/pointing_you.jpg"

  - type: match
    id: match_5
    prompt: "Match the conjugations!"
    pairs:
      - left: "I / Ig"
        right: "gseh"
      - left: "Du"
        right: "gsehsch"
      - left: "Är / Si / Äs"
        right: "gseht"

  - type: cloze
    id: cloze_6
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "You see her."
      helper: "Du siehst sie."
      target: ["Du gsehsch ", "."]
    answers: ["se", "si"]
    solution_display: |
      ✅ Correct!
      
      In the accusative (*receiving* the action), **si** turns to **se** (or **si**).
    images:
      - "data/assets/images/woman_waving.jpg"
    audio: "data/assets/audio/dugsehschse.mp3"

  - type: order
    id: order_7
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "He sees it."
      helper: "Er sieht es."
    tokens: ["Är", "gseht", "s."]
    solution_display: |
      ✅ Correct!
      
      In the accusative, **äs** turns to **s** (which can be appended to the verb, like **gseht's**, or treated as its own thing).
    audio: "data/assets/audio/aergsehts.mp3"

  - type: true_false
    id: true_false_8
    prompt: "What do you think is said?"
    audio: "data/assets/audio/igsehsedoert.mp3"
    text: "The *her* referred to here is **closeby**."
    answer: "False"
    solution_display: |
      ✅ Correct!
      
      This person said **I gseh se dört!**, which means *I see her tere!*

  - type: order
    id: order_9
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "Do you see him here?"
      helper: "Siehst du es hier?"
    tokens: ["Gsehsch", "du", "ne", "hie?"]
    solution_display: |
      ✅ Correct!
      
      You can use both **ne** or **ihn** for *him*.
    audio: "data/assets/audio/gsehschdunehie.mp3"

  - type: translate_type
    id: translate_type_10
    prompt: "Translate the following Sentence."
    sentence:
      question: "Does he see me?"
      helper: "Sieht er mich?"
    answers:
      ["Gseht är mi?", "Gsehter mi?"]
    images:
      - "data/assets/images/tall_guy_lake.jpg"
    solution_display: |
      ✅ Correct!
      
      Remember: In a question sentence, the order is flipped to *verb->subject*.

  - type: listen_type
    id: listen_type_11
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/igsehdi.mp3"
    answers: ["I gseh di"]
    images:
      - "data/assets/images/hideandseek.jpg"
    solution_display: |
      ✅ Correct!
      
      **Di** is the *accusative* form of **du**.

  - type: match
    id: match_13
    prompt: "Match the conjugations."
    pairs:
      - left: "I / Ig"
        right: "gseh"
      - left: "Du"
        right: "gsehsch"
      - left: "Är / Si / Äs"
        right: "gseht"

  - type: match
    id: match_14
    prompt: "Match the accusative forms."
    pairs:
      - left: "I / Ig"
        right: "mi"
      - left: "Du"
        right: "di"
      - left: "Är"
        right: "ihn / ne"
      - left: "Si"
        right: "si / se"
      - left: "Äs"
        right: "-s"

  - type: markdown
    id: markdown_12
    markdown: |
      ## Personal pronouns in the accusative: Plural
      
      Again, same as English: You don't say *I see they*, but rather *I see them*. In Bärndütsch, we would say **I gseh *se***. Note: **Se** is again the same, just like **si** (*she*) and **si** (*they*); it's mostly obvious from context what you mean though.
      
      Here's a list of all of the plural ones:
      
      <center>
      
      | singular | **sing. acc.**| *Example* |
      | --- | --- | --- |
      | Mir | **üs** | **Du gsehsch *üs*** (*you see us*) |
      | Dir | **öich / nech** | **I gseh *öich*** or **I gseh *nech*** (*I see you*) |
      | Si | **se** | **Si gseht *se*** (*she sees them*) |
      
      </center>
      
      You'll notice something: You already heard **öich** before in the *polite form*. That's because the polite form is just the same form as **dir** (so, to be polite to someone, you would call them *you (pl.)*-> **dir**!
      Example:
      
      - *How are you (pl.)?* -> **Wie geits öich?** (to multiple people)
      - *How are you (formal)?* -> **Wie geits öich?** (to an older person, for example)
    images:
      - "data/assets/images/polite_intro.jpg"

  - type: match
    id: match_15
    prompt: "Match the conjugations."
    pairs:
      - left: "Mir"
        right: "gseh (*we*)"
      - left: "Dir"
        right: "gseht"
      - left: "Si"
        right: "gseh (*they*)"

  - type: cloze
    id: cloze_16
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "We see you (pl.)!"
      helper: "Wir sehen euch!"
      target: ["Mir ", "!"]
    answers: ["gseh öich", "gseh nech", "gsehnech"]
    solution_display: |
      ✅ Correct!
      
      The accusative of *you* (pl.) is **öich** or **nech**. You can technically write the **nech** as an attachment to the word (**I gsehnech**), but either way is perfectly fine!
    images:
      - "data/assets/images/group_back_beach.jpg"
    audio: "data/assets/audio/mirgsehnech.mp3"

  - type: order
    id: order_17
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "They see us!"
      helper: "Sie sehen uns!"
    tokens: ["Si", "gseh", "üs!"]
    solution_display: |
      ✅ Correct!
      
      For *we* (**mir**), we use **üs** in the accusative.
    audio: "data/assets/audio/sigsehues.mp3"

  - type: cloze
    id: cloze_18
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "He sees them!"
      helper: "Er sieht sie!"
      target: ["Är gseht ", "."]
    answers: ["se", "si"]
    solution_display: |
      ✅ Correct!
      
      For **si** (*they*), the accusative is **se**. This is kind of the same as for **si** (*she*). Usually the context clears this up! (not here though)
    images:
      - "data/assets/images/guy_transtation.jpg"
    audio: "data/assets/audio/aergsehtse.mp3"

  - type: cloze
    id: cloze_19
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "We see you all and you all see us."
      helper: "Wir sehen euch und ihr seht uns."
      target: ["Mir gseh öich u ", "."]
    answers: ["dir gseht üs", "dir gsehtnis"]
    images:
      - "data/assets/images/football_standoff.jpg"
    audio: "data/assets/audio/mirgsehoeichudirgsehtues.mp3"

  - type: listen_type
    id: listen_type_20
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/gsehschduues.mp3"
    answers: ["Gsesch du üs?"]
    images:
      - "data/assets/images/guy_trainstation.jpg"
    solution_display: |
      ✅ Correct!
      
      This means *do you see us?*.

  - type: true_false
    id: true_false_21
    prompt: "What do you think is said?"
    audio: "data/assets/audio/igsehnech.mp3"
    text: "This person is encountering **one person**."
    answer: "False"
    solution_display: |
      ✅ Correct! 
      
      This person is saying **I gseh nech** (or **I gseh öich**), which means *I see you (pl.)*!

  - type: match
    id: match_22
    prompt: "Match the conjugations."
    pairs:
      - left: "Mir"
        right: "gseh (*we*)"
      - left: "Dir"
        right: "gseht"
      - left: "Si"
        right: "gseh (*they*)"

  - type: match
    id: match_23
    prompt: "Match the accusative forms."
    pairs:
      - left: "Mir"
        right: "Üs"
      - left: "Dir"
        right: "Öich / Nech"
      - left: "Si"
        right: "se"
