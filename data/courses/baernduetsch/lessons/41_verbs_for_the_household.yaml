    audio: "data/assets/audio/abwaesche.mp3"

  - type: markdown
    id: markdown_30
    markdown: |
      # Conjugating a separable verb
      
      If you have a separable verb with a prefix, like ***ab*wäsche**, you have to only pay attention to one thing when you conjugate it: **The prefix *separates* and goes after the verb!** The verb itself you can just conjugate like the non-separable version of the verb.
      
      In practice, this means the following:
      - ***ab*wäsche**
      	- **I wische *ab***
      	- **Du wischisch *ab***
      	- **Är wischt *ab***
      	- **Mir wäsche *ab***
      	- **Dir wäschet *ab***
      	- **Si wäsche *ab***
      
      You can see: **Abwäsche** conjugated is just the forms of the verb **wäsche** with the **ab** added at the end!
      
      So just remember: A *separable* verb is a verb that has a prefix that changes its meaning. And when you conjugate it, you put that prefix at the end!
    images:
      - "data/assets/images/writing.jpg"

