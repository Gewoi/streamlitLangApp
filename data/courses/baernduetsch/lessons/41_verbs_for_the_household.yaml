    solution_display: |
      ✅ Correct!
      
      **Mir wäsche ab** means *we do the dishes*. In a question, we flip the order of pronoun and verb; the prefix of the *separable* verb is still at the end of the phrase!
    audio: "data/assets/audio/waeschemirmornab.mp3"

