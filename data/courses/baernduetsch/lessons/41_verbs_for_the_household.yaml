  - type: markdown
    id: markdown_28
    markdown: |
      # Separable Verbs
      
      In Bärndütsch, as well as in Standard German, some verbs can have an additional prefix or suffix that changes their meaning. This sounds complicated, but you already know this from English! Think about *to turn* vs. *to turn in*.
      
      - *turning a book* is flipping it so you can see it's back
      - *turning in a book* is handing it in before a deadline
      
      Then, you can also *turn up*, *turn down*, etc.
      
      
      German and Bärndütsch have the same thing, and a great example is **wäsche** vs. ***ab*wäsche**
      
      - **wäsche** is to wash clothes, or yourself
      - ***ab*wäsche** specifically refers to the act of *doing dishes / washing dishes*
      
      **Ab** generally means *from* or *away from*. If you add it in front of **wäsche**, you turn it into the verb for doing dishes!
    images:
      - "data/assets/images/man_dishes.jpg"

  - type: introduce_word
    id: introduce_word_29
    word: "abwäsche"
    translation:
      en: "to wash dishes / do dishes"
      de: "abwaschen"
    images:
