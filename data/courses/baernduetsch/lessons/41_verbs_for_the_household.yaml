      ✅ Correct!
      
      **Si wischt ab** means *she's washing the dishes*. Generally, the prefix of the *separable* verb goes at the end of the phrase! That's why you see the **ab** at the very end there.
    audio: "data/assets/audio/siwischthuetab.mp3"

