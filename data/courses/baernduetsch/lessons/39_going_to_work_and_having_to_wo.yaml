id: 39_going_to_work_and_having_to_wo
title: "🚶 Going to Work, and Having to Work"
description: "Learn about a very unique thing in Swiss German: The doubling of the word *gah* when talking about an action, and learn the verb **müesse**."
estimated_minutes: 3
section: Jobs

steps:
  - type: markdown
    id: markdown_0
    markdown: |
      ## Swiss German vs Standard German
      
      When you want to say the phrase *I go to work*, the German translation is pretty straightforward:
      - *Ich gehe arbeiten*
      
      But in Swiss German, you **cannot** really say ***I gah schaffe***; that one doesn't sound right!
      
      Whenever you talk about something you are on your way to doing, or some activity you're going to do, you **use the word *gah* twice!**
      
      So instead of ***I gah schaffe***, the correct form is actually:
      
      - **I gah gah schaffe**
      
      That's one of the more unique things about Swiss German, and you'll find it across dialects.
      
    images:
      - "data/assets/images/question_mark.jpg"

  - type: introduce_word
    id: introduce_word_1
    word: "I gah gah schaffe"
    translation:
      en: "I go to work"
      de: "Ich gehe arbeiten"
    images:
      - "data/assets/images/construction_work.jpg"
    audio: "data/assets/audio/igahgahschaffe.mp3"

  - type: markdown
    id: markdown_2
    markdown: |
      ## Du *geisch* gah schaffe
      
      Important about this: The first verb *adjusts to the person*, but the second one is always the base form **gah**. 
      
      - **Du *geisch* gah schaffe**
      - **Si *geit* gah schaffe**
      - **Mir *göh* gah schaffe**
      - **Dir *göht* gah schaffe**
      
      It's also not exclusive to just **schaffe**: Any activity that you're planning on doing or on your way to needs the verb **gah** *two times*!
      
      - **Mir göh gah schwümme** (*We go swimming*)
      - **Är geit gah wandere** (*He goes hiking*)
      - **Dir göht gah loufe** (*You (pl) go for a walk*)
      - **Si göh gah iichoufe** (*They go shopping*)
      
      So, in summary: Any **activity** that you're **going to do** or **on your way to doing**, you'll need the verb **gah** *two times*! The first one **conjugated**, the second one just the base form **gah**.
      
    images:
      - "data/assets/images/walking_shoes.jpg"

  - type: choose
    id: choose_3
    prompt: "Choose the correct way of saying *She is going to work*"
    images:
      - "data/assets/images/woman_waving_two.jpg"
    single_answer: true
    correct_answers: ["Si geit gah schaffe"]
    wrong_answers: ["Si gah gah schaffe", "Si geit schaffe", "Si geit geit schaffe"]
    solution_display: |
      ✅ Correct!
      
      We need the word **gah** twice; the first one conjugated, and the second one in the base form **gah**!
    audio: "data/assets/audio/sigeitgahschaffe.mp3"

  - type: order
    id: order_4
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "We're going to work."
      helper: "Wir gehen arbeiten."
    tokens: ["Mir", "göh", "gah", "schaffe."]
    solution_display: |
      ✅ Correct!
    audio: "data/assets/audio/mirgoehgahschaffe.mp3"

  - type: listen_type
    id: listen_type_5
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/dirgoehtjetzgahschaffe.mp3"
    answers: ["Dir göht jetz gah schaffe.", "Dir göht jetzt gah schaffe.", "Dir goeht jetz gah schaffe.", "Dir goeht jetzt gah schaffe."]
    images:
      - "data/assets/images/meeting3.jpg"
    solution_display: |
      ✅ Correct!
      
      This means *You (pl) are going to work now*.

  - type: cloze
    id: cloze_6
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "I go to work tomorrow."
      helper: "Ich gehe morgen arbeiten."
      target: ["I gah ", " schaffe."]
    answers: ["morn gah"]
    solution_display: |
      ✅ Correct!
      
      To specify *when* you do an activity, the word is *squeezed in* between the two uses of **gah**: **I gah *morn* gah schaffe**.
    images:
      - "data/assets/images/calendar_circles.jpg"
    audio: "data/assets/audio/igahmorngahschaffe.mp3"

  - type: introduce_word
    id: introduce_word_7
    word: "müesse"
    translation:
      en: "to must / to have to"
      de: "müssen"
    images:
      - "data/assets/images/work_guy.jpg"
    audio: "data/assets/audio/muesse.mp3"

  - type: match
    id: match_9
    prompt: "Match the conjugations!"
    pairs:
      - left: "I / Ig"
        right: "mues (*I*)"
      - left: "Du"
        right: "muesch"
      - left: "Är / Si / Äs"
        right: "mues (*he/she/it*)"

  - type: match
    id: match_10
    prompt: "Match the conjugations!"
    pairs:
      - left: "Mir"
        right: "müesse (*we*)"
      - left: "Dir"
        right: "müesst"
      - left: "Si"
        right: "müesse (*they*)"

  - type: order
    id: order_11
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "We have to go now."
      helper: "Wir müssen jetzt gehen."
    tokens: ["Mir", "müesse", "jetz", "gah."]
    solution_display: |
      ✅ Correct!
      
      **Mir müesse** means *we have to/must*.
    audio: "data/assets/audio/mirmuessejetzgah.mp3"

  - type: cloze
    id: cloze_12
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "He has to give me something."
      helper: "Er muss mir etwas geben."
      target: ["Är ", " öppis gäh."]
    answers: ["mues mir"]
    solution_display: |
      ✅ Correct!
      
      We've seen already that *giving* someone to something requires the *Dativ*! That is why we use **mir** here (look at the lesson about giving gifts again if you feel a bit insecure about that). **Är mues** means *he has to/must*.
    images:
      - "data/assets/images/giving_gift.jpg"
    audio: "data/assets/audio/aermuesmiroeppisgaeh.mp3"

  - type: listen_type
    id: listen_type_13
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/dumueschnuetmache.mp3"
    answers: ["Du muesch nüt mache", "Du muesch nuet mache"]
    images:
      - "data/assets/images/thumbs_up.jpg"
    solution_display: |
      ✅ Correct!
      
      **Nüt** means *nothing*, and **du muesch** means *you (singular) have to/must*.

  - type: markdown
    id: markdown_8
    markdown: |
      ## For activities: *Gah* also after *müesse*
      
      In English, you would say: *I have to **go** (to) work*, *I have to **go** running*, *I have to **go** read*, etc.
      
      In Bärndütsch, the construct is very similar: We also inject a **gah**! Here it's a bit more clear where it comes from though:
      
      - *I have to **go** (to) work* -> **I mues *gah* schaffe**
      - *You have to **go** running* -> **Du muesch *gah* jogge**
      - *She has to **go** reading -> **Si mues *gah* läse**
      
      So, again: Before an activity, we usually throw in a **gah**. That happens after **müesse** (**I mues *gah* schaffe**) and other modal verbs (like **chönne**=*to be able to*), but also after **gah** (**I gah *gah* schaffe**).
    images:
      - "data/assets/images/idea.jpg"

  - type: order
    id: order_14
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "You (pl) have to go to work tomorrow."
      helper: "Ihr müsst morgen arbeiten gehen."
    tokens: ["Dir", "müesst", "morn", "gah", "schaffe."]
    solution_display: |
      ✅ Correct!
      
      We add a **gah** before an activity. Note that the order is slightly different than Standard German: We always use the **gah** *before* the verb (**gah schaffe** vs. *arbeiten gehen*).
    audio: "data/assets/audio/dirmuesstmorngahschaffe.mp3"

  - type: cloze
    id: cloze_15
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "We don't have to go to work on Saturday."
      helper: "Wir müssen am Samstag nicht arbeiten gehen."
      target: ["Mir müesse am Samsti nid ", "."]
    answers: ["gah schaffe"]
    images:
      - "data/assets/images/saturday.jpg"
    audio: "data/assets/audio/mirmuesseamsamstinidgahschaffe.mp3"

  - type: listen_type
    id: listen_type_16
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/mueschdumorngahschaffe.mp3"
    answers: ["Muesch du morn gah schaffe?"]
    images:
      - "data/assets/images/woman_asking.jpg"
    solution_display: |
      ✅ Correct!
      
      This means *do you have to go to work tomorrow?*.

  - type: true_false
    id: true_false_17
    prompt: "What do you think is said?"
    audio: "data/assets/audio/igahmorngahschaffe.mp3"
    text: "This person has **a free day** tomorrow."
    answer: "False"
    solution_display: |
      ✅ Correct!
      
      They said: **I gah morn gah schaffe**, which means *I go to work tomorro*.

  - type: order
    id: order_18
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "You can't go to work today!"
      helper: "Du kannst heute nicht arbeiten gehen!"
    tokens: ["Du", "chasch", "hüt", "nid", "gah", "schaffe!"]
    solution_display: |
      ✅ Correct!
      
      **Chönne** (**Du chasch**) is also a *modal verb*, and for activities that you go to, we use an additional **gah**!
    audio: "data/assets/audio/duchaschhuetnidgahschaffe.mp3"

  - type: cloze
    id: cloze_19
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "I'm not here tomorrow. I have to go to work."
      helper: "Ich bin morgen nicht hier. Ich muss arbeiten gehen."
      target: ["I bi morn nid hie. ", "."]
    answers: ["I mues gah schaffe"]
    images:
      - "data/assets/images/meeting3.jpg"
    audio: "data/assets/audio/ibimornnidhie_imuesgahschaffe.mp3"

  - type: match
    id: match_20
    prompt: "Match the conjugations."
    pairs:
      - left: "I / Ig"
        right: "mues (*I*)"
      - left: "Du"
        right: "muesch"
      - left: "Är / Si / Äs"
        right: "mues (*he/she/it*)"

  - type: match
    id: match_21
    prompt: "Match the conjugations."
    pairs:
      - left: "Mir"
        right: "müesse (*we*)"
      - left: "Dir"
        right: "müesst"
      - left: "Si"
        right: "müesse (*they*)"

  - type: match
    id: match_22
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "I have to go to work."
        right: "I mues gah schaffe."
      - left: "He goes to work."
        right: "Är geit gah schaffe."
      - left: "We can't go to work."
        right: "Mir chöi nid gah schaffe."
      - left: "They have to go now."
        right: "Si müesse jetzt gah."
