id: 17_using_adjectives_indefinite_ar
title: "Using Adjectives: Indefinite Articles"
description: "Learn how to use adjective when the come after an indefinite article, and learn some new nouns and adjectives along the way."
estimated_minutes: 4
section: Simple Concepts

steps:
  - type: introduce_word
    id: introduce_word_0
    word: "Ä Mönsch"
    translation:
      en: "A human"
      de: "Ein Mensch"
    images:
      - "data/assets/images/girl_smiling.jpg"
    audio: "data/assets/audio/aemoensch.wav"

  - type: cloze
    id: cloze_1
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "I am a human."
      helper: "Ich bin ein Mensch."
      target: ["I bine ", "."]
    answers: ["Mönsch", "Moensch"]
    solution_display: |
      ✅ Correct!
      
      **Mönsch** means *human*.
    images:
      - "data/assets/images/guy_headphones.jpg"
    audio: "data/assets/audio/ibinemoensch.wav"
