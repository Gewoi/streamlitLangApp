id: 25_numbers_1_to_6
title: "🔢 Numbers 1 to 6"
description: "Learn the numbers from 1 to 6."
estimated_minutes: 3
section: Appointments

steps:
  - type: introduce_word
    id: introduce_word_0
    word: "Eis, Zwöi, Drü"
    translation:
      en: "One, Two, Three"
      de: "Eins, Zwei, Drei"
    images:
      - "data/assets/images/medals_123.jpg"
    audio: "data/assets/audio/eis_zwoei_drue.wav"

  - type: order
    id: order_1
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "One, Two, Three"
      helper: "Eins, Zwei, Drei"
    tokens: ["Eis,", "Zwöi,", "Drü"]
    audio: "data/assets/audio/eis_zwoei_drue.wav"

  - type: cloze
    id: cloze_2
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "I see two men there."
      helper: "Ich sehe zwei Männer dort."
      target: ["I gseh ", " Männer dört."]
    answers: ["zwöi", "zwoei"]
    solution_display: |
      ✅ Correct!
      
      In modern times, when you want to say how many of something there is (two men, three houses, etc.), you can just say **number + plural**.
    images:
      - "data/assets/images/polite_intro.jpg"
    audio: "data/assets/audio/igsehzwoeimaennerdoert.wav"

  - type: markdown
    id: markdown_3
    markdown: |
      ## How to use numbers
      
      In modern times, when you want to say how many of something there is (two men, three houses, etc.), you can just say **number + plural**.
      
      Except, of course, if there's only one. In that case you have two options:
      - Either just use the *indefinite* article (**ä, äs**)
      - Or, if you want to emphasize a *difference* or just give a *list of amounts* ("one man, but three children" or "one croissant and two coffees"):
      	- **Ei** for *masculine* and *feminine* nouns -> **Ei Maa**, **Ei Frou**, **Ei Bärg**
      	- **Eis** for *neuter* nouns -> **Eis Huus**, **Eis Chind**, **Eis Tier**
      
      
      Some older folks will say that this is "*wrong*" and you should say **zwee Männer**. But ignore them! This part of the language has mostly evolved away over the years, and it's completely correct to just say **number + plural**.
      
      Bärndütsch varies a bit by the region you're in, and like all languages, it evolves. So, if you use it like this, you're at the "forefront" of the language in a way ;)
    images:
      - "data/assets/images/glasses.jpg"

  - type: match
    id: match_8
    prompt: "Match the correct way to say *One ...*"
    pairs:
      - left: "Ei"
        right: "Maa"
      - left: "Eis"
        right: "Chind"

  - type: match
    id: match_9
    prompt: "Match the correct way to say *One ...*"
    pairs:
      - left: "Ei"
        right: "Bahnhof"
      - left: "Eis "
        right: "Huus"

  - type: introduce_word
    id: introduce_word_4
    word: "Zahl / Zahle"
    translation:
      en: "Number / Numbers"
      de: "Zahl / Zahlen"
    images:
      - "data/assets/images/numbers.jpg"
    audio: "data/assets/audio/zahl_zahle.wav"

  - type: cloze
    id: cloze_5
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "One, two and three are numbers."
      helper: "Eins, zwei und drei sind Zahlen."
      target: ["Eis, zwöi u drü si ", "."]
    answers: ["Zahle"]
    solution_display: |
      ✅ Correct!
      
      The word for *number* is **Zahl**, and it's plural is **Zahle**.
    images:
      - "data/assets/images/medals_123.jpg"
    audio: "data/assets/audio/eiszwoeiudruesizahle.wav"

  - type: translate_type
    id: translate_type_7
    prompt: "Translate the following Sentence."
    sentence:
      question: "Three, two, one..."
      helper: "Drei, zwei, eins..."
    images:
      - "data/assets/images/rocket.jpg"
    solution_display: |
      ✅ Correct!
      
      This is how you would do a countdown!

  - type: translate_type
    id: translate_type_10
    prompt: "Translate the following Sentence."
    sentence:
      question: "Two is a number."
      helper: "Zwei ist eine Zahl."
    answers:
      ["Zwöi isch e Zahl", "Zwoei isch e Zahl", "Zwöi isch ä Zahl", "Zwoei isch ae Zahl"]
    images:
      - "data/assets/images/two_fingers.jpg"
    solution_display: |
      ✅ Correct!
      
      **Zwöi** means *two*, and **e Zahl** means *a number*.
      
      Note that the word **Nummer** for *number* also exists; this is used for things like *phone number* (**Telefonnummere**) and specific items (*number 8 on the menu* is **Nummer 8 ufem Menü**).

  - type: listen_type
    id: listen_type_11
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/druezwoeieis.wav"
    answers: ["Drü, Zwöi, Eis", "Drue, Zwoei, Eis"]
    images:
      - "data/assets/images/rocket_launch.jpg"
    solution_display: |
      ✅ Correct!

  - type: match
    id: match_6
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "One"
        right: "Eis"
      - left: "Two"
        right: "Zwöi"
      - left: "Three"
        right: "Drü"

  - type: introduce_word
    id: introduce_word_12
    word: "Vier, Füf, Sächs"
    translation:
      en: "Four, Five, Six"
      de: "Vier, Fünf, Sechs"
    images:
      - "data/assets/images/4_5_6.jpg"
    audio: "data/assets/audio/vierfuefsaechs.wav"

  - type: order
    id: order_13
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "The numbers are four, five and six."
      helper: "Die Zahlen sind vier, fünf und sechs."
    tokens: ["D", "Zahle", "si", "vier,", "füf", "u", "sächs."]
    solution_display: |
      ✅ Correct!
    audio: "data/assets/audio/dzahlesivierfuefusaechs.wav"

  - type: cloze
    id: cloze_14
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "The numbers are three, six and five."
      helper: "Die Zahlen sind drei, sechs und fünf."
      target: ["D Zahle si ", "."]
    answers: ["Drü, Sächs u Füf", "Drue, Saechs u Fuef", "Drüü, Sächs u Füüf", "Drü, Sächs und Füf", "Drüü, Sächs und Füüf"]
    solution_display: |
      ✅ Correct!
      
      The numbers from 1 to 6 are **Eis, Zwöi, Drü, Vier, Füf, Sächs**.
    images:
      - "data/assets/images/lottery_wheel.jpg"
    audio: "data/assets/audio/dzahlesidruesaechsufuef.wav"

  - type: true_false
    id: true_false_15
    prompt: "What do you think is said?"
    audio: "data/assets/audio/igsehvierbaerge.wav"
    text: "This person sees **six (6) mountains**."
    answer: "False"
    solution_display: |
      ✅ Correct!
      
      They said **I gseh vier Bärge**, which means *I see four mountains*.

  - type: match
    id: match_16
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "Four"
        right: "Vier"
      - left: "Five"
        right: "Füf"
      - left: "Six"
        right: "Sächs"

  - type: order
    id: order_17
    prompt: "Order the numbers from 1 to 6!"
    sentence:
      question: ""
      helper: ""
    tokens: ["Eis", "Zwöi", "Drü", "Vier", "Füf", "Sächs"]
    audio: "data/assets/audio/eiszwoeidruevierfuefsaechs.wav"

  - type: translate_type
    id: translate_type_18
    prompt: "Translate the following Sentence."
    sentence:
      question: "I have one big plant and three small plants."
      helper: "Ich habe eine grosse Pflanze und drei kleine Pflanzen."
    images:
      - "data/assets/images/woman_smelling_big_plant.jpg"
    solution_display: |
      ✅ Correct!
      
      If you *emphasize* that you have *one* of something, you use **Ei** for *masculine* and *feminine* nouns, and **Eis** for *neuter* nouns. For all other numbers, you use **number + plural** (**drü  Pflanze**, **zwöi Hüser**,...).

  - type: translate_type
    id: translate_type_19
    prompt: "Translate the following Sentence."
    sentence:
      question: "Number"
      helper: ""
    answers:
      ["Zahl", "Nummer"]
    images:
      - "data/assets/images/4_5_6.jpg"
    solution_display: |
      ✅ Correct!
      
      The word **Nummer / Nummere** also exists; the main difference is this:
      - **Zahl** is usually an *amount* or a *mathematical* expression
      - **Nummer** is an *identification* or a *code* (*phone number*, *room number*)

  - type: match
    id: match_20
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "One"
        right: "Eis"
      - left: "Two"
        right: "Zwöi"
      - left: "Three"
        right: "Drü"
      - left: "Four"
        right: "Vier"
      - left: "Five"
        right: "Füf"
      - left: "Six"
        right: "Sächs"
      - left: "Number"
        right: "Zahl"
