id: 32_my_family_plural_possesives
title: "👨‍👩‍👧‍👦 My Family: Plural Possesives"
description: "Learn how to talk about your family, and learn about the plural forms of possesives."
estimated_minutes: 3
section: People

steps:
  - type: introduce_word
    id: introduce_word_0
    word: "Üsi Familie"
    translation:
      en: "Our family"
      de: "Unsere Familie"
    images:
      - "data/assets/images/family_sofa.jpg"
    audio: "data/assets/audio/uesifamilie.wav"

  - type: cloze
    id: cloze_1
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "Our family is big."
      helper: "Unsere Familie ist gross."
      target: ["", " isch gross"]
    answers: ["Üsi Familie isch gross", "Uesi Familie isch gross"]
    solution_display: |
      ✅ Correct!
      
      **Üsi Familie** means *our family*.
    images:
      - "data/assets/images/family_big_dinner.jpg"
    audio: "data/assets/audio/uesifamilieischgross.wav"

  - type: introduce_word
    id: introduce_word_2
    word: "Öie Brueder"
    translation:
      en: "Your (pl/formal) brother"
      de: "Euer Bruder"
    images:
      - "data/assets/images/guy__with_headphones.jpg"
    audio: "data/assets/audio/oeiebrueder.wav"

  - type: cloze
    id: cloze_3
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "Your (pl) brother is doing somethig!"
      helper: "Euer Bruder macht etwas!"
      target: ["", " mach öppis!"]
    answers: ["Öie Brueder", "Oeie Brueder"]
    solution_display: |
      ✅ Correct!
      
      **Öie Brueder** means *your brother*, both as in "*you all's brother*", as well as formally (*your brother, miser Schmid* for example).
    images:
      - "data/assets/images/guy_pottery.jpg"
    audio: "data/assets/audio/oeiebruedermachtoeppis.wav"

  - type: introduce_word
    id: introduce_word_4
    word: "Ihri Schwöschter"
    translation:
      en: "Their sister / Her sister"
      de: "Ihre Schwester"
    images:
      - "data/assets/images/woman_waving_two.jpg"
    audio: "data/assets/audio/ihrischwoeschter.wav"

  - type: order
    id: order_5
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "Their sister has a child."
      helper: "Ihre Schwester hat ein Kind."
    tokens: ["Ihri", "Schwöschter", "hett", "es", "Chind."]
    solution_display: |
      ✅ Correct!
      
      **Ihri Schwöschter** can mean both *their sister* as well as *her sister*. The possesives for **si**/*they* are actually **exactly the same** as for **si**/*she*.
    audio: "data/assets/audio/ihrischwoeschterhetteschind.wav"

  - type: markdown
    id: markdown_6
    markdown: |
      ## Plural forms
      
      The plural forms for possesives follow the same rules as the singular forms for **si** (*she*) you saw last lesson:
      
      - *masculine*: Ends in **-e** -> **Üse Brueder** (*Our brother*)
      - *feminine*: Ends in **-i** -> **Ihri Schwöschter** (*Their sister*)
      - *neuter*: Ends in **-es** -> **Öies Huus** (*Your (pl.) house*)
      
      Here's a full list of the forms:
      
      <center>
      
      | pronoun | poss. masculine | poss. feminine | poss. neuter |
      | --- | --- | --- | --- |
      | Mir | **Üse** | **Üsi** | **Üses** |
      | Dir | **Öie** | **Öii** | **Öies** |
      | Si | **Ihre** | **Ihri** | **Ihres** |
      
      </center>
      
      Two things to note here:
      - The forms for **si** (*they*) are actually exactly the same as those for **si** (*she*)! Here, context usually makes it clear; but it can sometimes lead to confusion.
      - The **dir** forms are the *formal/polite* forms too; use those when you adress someone formally!
      
      **Öii** is actually pronounced as **Öi-i**, so pronounce the *i* twice.
    images:
      - "data/assets/images/group_selfie.jpg"

  - type: order
    id: order_7
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "Here is your croissant. Enjoy your meal!"
      helper: "Hier ist ihr Croissant. Guten Appetit!"
    tokens: ["Hie", "isch", "öies", "Gipfeli.", "Ä", "guete!"]
    solution_display: |
      ✅ Correct!
      
      Here, the person is adresses *formally*, so they use **öies Gipfeli**.
    audio: "data/assets/audio/hieischoeiesgipfeli_eguete.wav"

  - type: cloze
    id: cloze_8
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "Our sister isn't available."
      helper: "Unsere Schwester kann nicht."
      target: ["", " cha nid."]
    answers: ["Üsi Schwöschter", "Üsi Schwöster", "Uesi Schwoeschter", "Uesi Schwoester"]
    solution_display: |
      ✅ Correct!
      
      **Üsi** is *our* (fem.), and **Schwöschter** means *sister*.
    images:
      - "data/assets/images/girl_shopping.jpg"
    audio: "data/assets/audio/uesischwoeschterchanid.wav"

  - type: true_false
    id: true_false_10
    prompt: "What do you think is said?"
    audio: "data/assets/audio/ihrebruederischgliihie.wav"
    text: "**Her *or* their** brother is here soon."
    answer: "True"
    solution_display: |
      ✅ Correct!
      
      **Ihre** can be both for **si**/*she* and **si**/*they*. The person said **Ire brueder isch glii hie**, which means *her/their brother is here soon*.

  - type: match
    id: match_10
    prompt: "Match the possessives for **Mir**."
    pairs:
      - left: "Üsi"
        right: "Familie"
      - left: "Üse"
        right: "Brueder"
      - left: "Üses "
        right: "Huus"

  - type: translate_type
    id: translate_type_11
    prompt: "Translate the following Sentence."
    sentence:
      question: "Our family is big."
      helper: "Unsere Familie ist gross."
    answers: ["Üsi Familie isch gross."]
    images:
      - "data/assets/images/family_big_dinner.jpg"
    solution_display: |
      ✅ Correct!
      
      **Üsi Familie** means *our family*.

  - type: order
    id: order_12
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "Your (pl) parent's aren't available tomorrow."
      helper: "Eure Eltern können morgen nicht."
    tokens: ["Öii", "Eltere", "chöi", "morn", "nid."]
    solution_display: |
      ✅ Correct!
      
      **Öii Eltere** means *your (pl) parents*. Remember: Plural forms are *always* feminine!
      
      Also note how **öii** was pronounced: The **i-i** is a repeated sound.
    audio: "data/assets/audio/oeiielterechoeimornnid.wav"

  - type: listen_type
    id: listen_type_13
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/oeiebruederischeschind.wav"
    answers: ["Öie Brueder isch es Chind."]
    images:
      - "data/assets/images/kid_eating.jpg"
    solution_display: |
      ✅ Correct!
      
      This means *your (pl/formal) brother is a child*.

  - type: match
    id: match_14
    prompt: "Match the possesives for **Dir**."
    pairs:
      - left: "Öie"
        right: "Vater"
      - left: "Öii"
        right: "Mueter"
      - left: "Öies"
        right: "Chind"

  - type: choose
    id: choose_15
    prompt: "Choose all correct combinations of possessives and nouns!"
    images:
      - "data/assets/images/family_sofa.jpg"
    single_answer: false
    correct_answers: ["Ihre Brueder", "Üsi Schwöschter", "Öii Mueter", "Ihres Huus"]
    wrong_answers: ["Üses Brueder", "Öie Schwöschter", "Ihre Mueter", "Ihri Huus"]
    solution_display: |
      ✅ Correct!
      
      Remember:
      - *masculine* ends with **-e** (**üse, öie, ihre**)
      - *feminine* ends with **-i** (**üsi, öii, ihri**)
      - *neuter* ends with **-es** (**üses, öies, ihres**)

  - type: translate_type
    id: translate_type_16
    prompt: "Translate the following Sentence."
    sentence:
      question: "Your (pl) brother and our sister."
      helper: "Euer Bruder und unsere Schwester."
    images:
      - "data/assets/images/siblings_homework.jpg"
    solution_display: |
      ✅ Correct!

  - type: match
    id: match_17
    prompt: "Match the possessives for **Si**."
    pairs:
      - left: "Ihre"
        right: "Brueder"
      - left: "Ihri"
        right: "Schwöschter"
      - left: "Ihres"
        right: "Huus"
