id: 01_greetings
title: "👋 Greetings & Politeness"
description: "Say hello, ask how someone is, and be polite."
estimated_minutes: 5
section: Basics

steps:
  - type: markdown
    id: intro
    markdown: |
      ## How this course works
      
      - The **course language** is **English**.
      - The **target language** is **Bernese Swiss German** (*Bärndütsch*).
      - As often as possible, there will also be **Standard German** side by side.
      
      The Course gives explanations in between.

      In the beginning, the focus is on getting some basics and some grammatical concepts down, and then we go into the phrases and words we use everyay in **Bärndütsch**.
      
      IMPORTANT: Sometimes the *solution* displays also contain **helpful explanations**.

      If you make a mistake during an exercise, it will be added at the end of the lesson so you can practice again!
      
    images:
      - "data/assets/images/bern.jpg"

  - type: markdown
    id: important_note
    markdown: |
      ## Swiss German is not a written language!
      
      Unfortunately, there are *no rules* on how to write Swiss German.
      
      For this course, we will be relying on how a person in Bern would **Text their friends**. 
      It is impossible to include *all possible spellings*, so sometimes you might be shown that you're wrong even when you're **correct**.
      Also, the spelling might be slightly inconsistent; I based most of it on how I use it in everyday language. In the future I plan to revise and streamline this.

      This is partly due to me not thinking the programming through. Maybe in the future I'll upgrade it. For now, I'll say **sorry!**
      
      If you find a mistake, let me know. There is always a **skip button** except the last exercise in case you get stuck.
      
    images:
      - "data/assets/images/writing.jpg"

  - type: introduce_word
    id: word_hallo
    word: "Hallo / Tschau / Sälü"
    translation:
      en: "Hello"
      de: "Hallo"
    images:
      - "data/assets/images/hoi.jpg"
    audio: "data/assets/audio/hoi.wav"

  - type: markdown
    id: explanation_greeting
    markdown: |
      ## Greetings
      
      There are different ways to **greet someone**. 
      
      Very common is the German **Hallo**.
      
      We also have **Tschou** (or **Tschau**, adapted from the Italian *Ciao*),
      and **Sälü** (from the French *Salut*).
      
    images:
      - "data/assets/images/old_guy_half_wave.jpg"

  - type: cloze
    id: cloze_hoi
    prompt: "Fill in the missing Bernese word (answer in Bärndütsch)."
    sentence:
      question: "Hello, Claudio!"
      helper: "Hallo, Claudio!"
      target: [" ", ", Claudio!"]
    answers: ["hallo", "sälü", "tschau", "tschou"]
    audio: "data/assets/audio/hallo_claudio.wav"
    solution_display: |
      ✅ Correct! **Hallo** means hello.
      
      You can also say **Tschou** or **Sälü**, like in Italian and French respectively
    images:
      - "data/assets/images/woman_waving.jpg"

  - type: listen_type
    id: listen_type_17
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/hoi.wav"
    answers: ["Hallo tschau sälü", "hallo tschou sälü", "hallo tschau säli", "hallo tschou säli"]
    images:
      - "data/assets/images/handshake_cafe.jpg"
    solution_display: |
      ✅ Correct!
      
      The three main greetings we use are **hallo**, **tschau** (or **tschou**) and **sälü** (or **säli**).

  - type: introduce_word
    id: wiegeits_intr
    word: "Wie geit's? / Wie geit's dr?"
    translation:
      en: "How are you?"
      de: "Wie geht's?"
    images:
      - "data/assets/images/woman_asking.jpg"
    audio: "data/assets/audio/wiegeits.wav"

  - type: order
    id: order_wiegeits
    prompt: "Put the words in the correct order (Bernese)."
    sentence:
      question: "How are you?"
      helper: "Wie geht's dir?"
    tokens: ["Wie", "geit's", "dr?"]
    audio: "data/assets/audio/wiegeits.wav"
    solution_display: |
      ✅ Correct! 
      
      You can add the **dir/dr** if you're talking to a friend, but it's not necessary.

  - type: translate_type
    id: translate_Hallo
    prompt: "Translate the following Sentence"
    sentence:
      question: "Hello, how are you?"
      helper: "Hallo, wie geht es dir?"
    answers:
      ["hallo wie geits", "hallo wie geits dr", "hallo wie geits dir", "tschau wie geits", "tschau wie geits dr", "tschau wie geits dir", "tschou wie geits", "tschou wie geits dr", "tschou wie geits dir", "sälü wie geits", "sälü wie geits dr", "sälü wie geits dir"]
    images:
      - "data/assets/images/hoi.jpg"
    solution_display: |
      ✅ Correct! 
      
      You can add the **dir/dr** if you're talking to a friend, but it's not necessary.

  - type: listen_type
    id: listen_type_12
    prompt: "Listen and type what you hear (Bernese)."
    audio: "data/assets/audio/saeliwigeits.wav"
    answers: ["sälü wie geits", "säli wie geits"]
    images:
      - "data/assets/images/handshake.jpg"
    solution_display: |
      ✅ Correct! 
      
      **Sälü** is one of the ways we say *Hello*

  - type: introduce_word
    id: tschüss_tschau_säli
    word: "Tschüss / Tschau / Sälü"
    translation:
      en: "Bye!"
      de: "Tschüss!"
    images:
      - "data/assets/images/wavinghand_curtain.jpg"
    audio: "data/assets/audio/tschuesstschausaelu.wav"

  - type: true_false
    id: verabschiedung
    prompt: "What do you think is said?"
    audio: "data/assets/audio/saeliwigeits.wav"
    text: "This person is saying goodbye."
    answer: "False"
    solution_display: |
      ✅ Correct! 
      
      **Sälü** *can* mean goodbye, but here it's followed by **wie geits?** (*how are you?*).
      
      So, this person is saying hello.

  - type: translate_type
    id: translate_tschüss
    prompt: "Translate the following Sentence"
    sentence:
      question: "Bye!"
      helper: "Tschüss!"
    answers:
      ["Tschüss", "Tschou", "Tschau", "Sälü"]
    images:
      - "data/assets/images/wavinghand_curtain.jpg"
    solution_display: |
      ✅ Correct! 
      
      You can say bye in multiple ways, like **Tschüss**, **Tschau** or **Sälü**; similar to greetings.

  - type: match
    id: match_18
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "Hello"
        right: "Hallo / Tschau / Sälü"
      - left: "Bye"
        right: "Tschüss / Tschau / Sälü"
      - left: "How are you?"
        right: "Wie geits?"

  - type: cloze
    id: cloze_19
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "How are you?"
      helper: "Wie geht's?"
      target: ["Wie ", " dir?"]
    answers: ["geits", "geit's"]
    audio: "data/assets/audio/wiegeits.wav"
    solution_display: |
      ✅ Correct!
      
      You could also leave the **dir/dr** at the end away and just say **Wie geits?**.
    images:
      - "data/assets/images/old_people_conv_garden.jpg"

  - type: introduce_word
    id: bisspeter_intr
    word: "Bis später! / Bis speter!"
    translation:
      en: "See you later!"
      de: "Bis später!"
    images:
      - "data/assets/images/woman_waving.jpg"
    audio: "data/assets/audio/bisspeter.wav"

  - type: order
    id: order_20
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "Bye, see you later!"
      helper: "Tschüss, bis später!"
    tokens: ["Tschau,", "bis", "speter!"]
    audio: "data/assets/audio/tschussbisspeter.wav"
    solution_display: |
      ✅ Correct!
      
      Some people say the **ä** a bit more aggressively, like **sp*ä*ter**, but a softer **speter** is more common!

  - type: true_false
    id: verabschiedung_oder begrüssung
    prompt: "What do you think is said?"
    audio: "data/assets/audio/tschussbisspeter.wav"
    text: "This person is saying goodbye."
    answer: "True"
    solution_display: |
      ✅ Correct! 
      
      **Tschüss** is one of the ways we say *Bye*, and **bis später** means *see you later* (literally: *until later*).

  - type: listen_type
    id: listen_type_21
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/tschussbisspeter.wav"
    answers: ["Tschüss, bis speter", "Tschüss, bis später"]
    images:
      - "data/assets/images/wavinghand_curtain.jpg"
    solution_display: |
      ✅ Correct!
      
      This is how you would say goodbye to someone you'll see again that day!

  - type: choose
    images: 
      - "data/assets/images/old_guy_half_wave.jpg"
    prompt: "Choose all the ways to say *Hello*!"
    correct_answers: ["Hallo", "Tschau", "Sälü"]
    wrong_answers: ["Bis später", "Tschüss"]

  - type: introduce_word
    id: guet
    word: "Guet"
    translation:
      en: "Good"
      de: "Gut"
    images:
      - "data/assets/images/thumbs_up.jpg"
    audio: "data/assets/audio/guet.wav"

  - type: cloze
    id: cloze_guet
    prompt: "Fill in the missing Bernese word (answer in Bärndütsch)."
    sentence:
      question: "How are you doing? - Good!"
      helper: "Wie geht's? - Gut"
      target: ["Wie geits? - ", "!"]
    answers: ["guet"]
    audio: "data/assets/audio/wiegeits_guet.wav"
    solution_display: |
      ✅ Correct!
      
      We say **guet** for *good*, and for *bad*, we say **schlächt**.
    images:
      - "data/assets/images/conversation_casual.jpg"

  - type: listen_type
    id: listen_type_22
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/guet.wav"
    answers: ["guet"]
    images:
      - "data/assets/images/cool_plus.jpg"
    solution_display: |
      ✅ Correct!
      
      **Guet** means *good*.

  - type: match
    id: match_basic
    prompt: "Match the translations (English → Bernese)."
    pairs:
      - left: "Hi"
        right: "Hallo / Tschau / Sälü"
      - left: "Bye"
        right: "Tschüss / Tschou / Sälü"
      - left: "How are you?"
        right: "Wie geit's?"
      - left: "See you later!"
        right: "Bis speter!"
      - left: "good"
        right: "guet"
