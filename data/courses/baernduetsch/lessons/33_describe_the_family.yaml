id: 33_describe_the_family
title: "👉 Describe the Family"
description: "Learn about some more adjectives and more names of family members."
estimated_minutes: 5
section: People

steps:
  - type: introduce_word
    id: introduce_word_0
    word: "fründlech"
    translation:
      en: "polite"
      de: "freundlich"
    images:
      - "data/assets/images/handshake_cafe.jpg"
    audio: "data/assets/audio/fruendlech.mp3"

  - type: order
    id: order_1
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "They are polite."
      helper: "Sie sind freundlich."
    tokens: ["Si", "si", "fründlech."]
    solution_display: |
      ✅ Correct!
    audio: "data/assets/audio/sisifruendlech.mp3"

  - type: introduce_word
    id: introduce_word_2
    word: "unfründlech"
    translation:
      en: "impolite"
      de: "unfreundlich"
    images:
      - "data/assets/images/guy_thumbs_down.jpg"
    audio: "data/assets/audio/unfruendlech.mp3"

  - type: cloze
    id: cloze_3
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "He is impolite."
      helper: "Er ist unfreundlich."
      target: ["Är isch ", "."]
    answers: ["unfründlech", "unfruendlech"]
    solution_display: |
      ✅ Correct!
      
      **Fründlech** means *polite*, and **unfründlech** means *impolite*.
    images:
      - "data/assets/images/no.jpg"
    audio: "data/assets/audio/aerischunfruendlech.mp3"

  - type: order
    id: order_4
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "My brother is a polite person (human)."
      helper: "Mein Bruder ist ein freundlicher Mensch."
    tokens: ["Mi", "Brueder", "isch", "e", "fründleche", "Mönsch."]
    solution_display: |
      ✅ Correct!
      
      Remember: If you use an adjective *before* a noun, it adjusts. Generally, with some exceptions:
      - *masculine*: ends with **-e**
      - *feminine*: ends with **-i**
      - *neuter*: ends with **-s** or **-es**
    audio: "data/assets/audio/mibruederischefruendlechemoensch.mp3"

  - type: true_false
    id: true_false_5
    prompt: "What do you think is said?"
    audio: "data/assets/audio/aerischunfruendlech.mp3"
    text: "He is **polite**."
    answer: "False"
    solution_display: |
      ✅ Correct!
      
      They said **Är isch unfründlech**, which means *he is impolite* (**fründlech** would be *polite*).

  - type: introduce_word
    id: introduce_word_6
    word: "Grossvater / Grossmueter"
    translation:
      en: "Grandfather / Grandmother"
      de: "Grossvater / Grossmutter"
    images:
      - "data/assets/images/older_couple.jpg"
    audio: "data/assets/audio/grossvater_grossmueter.mp3"

  - type: choose
    id: choose_7
    prompt: "***Vater*** and ***Mueter*** are ***Eltere***; can you guess what grandparents are then?"
    images:
      - "data/assets/images/older_couple_talk.jpg"
    single_answer: true
    correct_answers: ["Grosseltere"]
    wrong_answers: ["Grandeltere", "Chliieltere"]
    solution_display: |
      ✅ Correct!
      
      Your **Grossvater** and your **Grossmueter** are your **Grosseltere** (*grandparents*).
    audio: "data/assets/audio/grosseltere.mp3"

  - type: cloze
    id: cloze_8
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "My grandfather is a polite person (human)."
      helper: "Mein Grossvater ist ein freundlicher Mensch."
      target: ["Mi ", " isch e fründleche Mönsch."]
    answers: ["Grossvater"]
    solution_display: |
      ✅ Correct!
      
      **Grossvater** is *grandfather*, and **Grossmueter** is *grandmother*.
    images:
      - "data/assets/images/old_guy_half_wave.jpg"
    audio: "data/assets/audio/migrossvaterischefruendlechemoensch.mp3"

  - type: match
    id: match_9
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "grandmother"
        right: "Grossmueter"
      - left: "grandfather"
        right: "Grossvater"
      - left: "father"
        right: "Vater"
      - left: "mother"
        right: "Mueter"
      - left: "parents"
        right: "Eltere"
      - left: "grandparents"
        right: "Grosseltere"

  - type: introduce_word
    id: introduce_word_10
    word: "glücklech / unglücklech"
    translation:
      en: "happy / unhappy"
      de: "glücklich / unglücklich"
    images:
      - "data/assets/images/emotions_icons.jpg"
    audio: "data/assets/audio/gluecklech_ungluecklech.mp3"

  - type: cloze
    id: cloze_11
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "My sister is happy."
      helper: "Meine Schwester ist glücklich."
      target: ["Mini Schwöschter ", "."]
    answers: ["isch glücklech", "isch gluecklech"]
    solution_display: |
      ✅ Correct!
      
      **Glücklech** means *happy*, and **unglücklech** means *unhappy*.
    images:
      - "data/assets/images/girl_smiling.jpg"
    audio: "data/assets/audio/minischwoeschterischgluecklech.mp3"

  - type: order
    id: order_12
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "I am unhappy today."
      helper: "Ich bin heute unglücklich."
    tokens: ["I", "bi", "hüt", "unglücklech."]
    audio: "data/assets/audio/ibihuetungluecklech.mp3"

  - type: markdown
    id: markdown_17
    markdown: |
      ## Luck
      
      *Glücklech / unglücklech* also means *lucky / unlucky*! You'll often here Swiss people say: **Das isch unglücklech** (*that is unfortunate / unlucky*).
      
      We won't focus on this for now, but it's good if you've already heard it!
    images:
      - "data/assets/images/luck.jpg"

  - type: introduce_word
    id: introduce_word_13
    word: "truurig"
    translation:
      en: "sad"
      de: "traurig"
    images:
      - "data/assets/images/sad_guy_able.jpg"
    audio: "data/assets/audio/truurig.mp3"

  - type: order
    id: order_14
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "Are you happy or sad?"
      helper: "Bist du glücklich oder traurig?"
    tokens: ["Bisch", "du", "glücklech", "oder", "truurig?"]
    solution_display: |
      ✅ Correct!
      
      **Glücklech** means *happy*, and **truurig** means *sad*.
    audio: "data/assets/audio/bischdugluecklechodertruurig.mp3"

  - type: translate_type
    id: translate_type_15
    prompt: "Translate the following Sentence."
    sentence:
      question: "A happy family!"
      helper: "Eine glückliche Familie!"
    answers: ["E glücklechi Familie!", "Ä glücklechi Familie!", "E gluecklechi Familie!"]
    images:
      - "data/assets/images/family_sofa.jpg"
    solution_display: |
      ✅ Correct!
      
      Remember, an adjective before a nound adjusts. **Familie** is *feminine*, so we say **glücklech*i***.

  - type: cloze
    id: cloze_16
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "A sad Monday."
      helper: "Ein trauriger Montag."
      target: ["Ä ", " Mänti."]
    answers: ["truurige"]
    solution_display: |
      ✅ Correct!
      
      All weekdays are *masculine*! So, when adding an adjective before it, we end it accordingly: **truurig*e***.
    images:
      - "data/assets/images/monday.jpg"
    audio: "data/assets/audio/aetruurigemaenti.mp3"

  - type: introduce_word
    id: introduce_word_18
    word: "müed"
    translation:
      en: "tired"
      de: "müde"
    images:
      - "data/assets/images/guy_yawn.jpg"
    audio: "data/assets/audio/mued.mp3"

  - type: cloze
    id: cloze_19
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "You are tired."
      helper: "Du bist müde."
      target: ["Du bisch ", "."]
    answers: ["müed"]
    solution_display: |
      ✅ Correct!
      
      **Müed** means *tired*.
    images:
      - "data/assets/images/cat_yawn.jpg"
    audio: "data/assets/audio/dubischmued.mp3"

  - type: listen_type
    id: listen_type_20
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/ibimued.mp3"
    answers: ["I bi müed."]
    images:
      - "data/assets/images/guy_yawn.jpg"
    solution_display: |
      ✅ Correct!
      
      This means *I am tired*.

  - type: order
    id: order_21
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "We are tired, we leave now. Bye!"
      helper: "Wir sind müde, wir gehen jetzt. Tschüss!"
    tokens: ["Mir", "si", "müed,", "mir", "göh", "jetz.", "Tschüss!"]
    solution_display: |
      ✅ Correct!
    audio: "data/assets/audio/mirsimuedmirgoehjetz_tschuess.mp3"

  - type: translate_type
    id: translate_type_22
    prompt: "Translate the following Sentence."
    sentence:
      question: "My gradparents are tired."
      helper: "Meine Grosseltern sind müde."
    answers: ["Mini Grosseltere si müed."]
    images:
      - "data/assets/images/elderly_couple_tired.jpg"
    solution_display: |
      ✅ Correct!

  - type: true_false
    id: true_false_23
    prompt: "What do you think is said?"
    audio: "data/assets/audio/ibihuetungluecklech.mp3"
    text: "This person is **tired** today?"
    answer: "False"
    solution_display: |
      ✅ Correct!
      
      This person is saying **i bi hüt unglücklech**, which means *I am unhappy today*.

  - type: match
    id: match_24
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "tired"
        right: "müed"
      - left: "happy"
        right: "glücklech"
      - left: "unhappy"
        right: "unglücklech"
      - left: "sad"
        right: "truurig"
      - left: "polite"
        right: "fründlech"
      - left: "impolite"
        right: "unfründlech"

  - type: match
    id: match_25
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "Father"
        right: "Vater"
      - left: "Mother"
        right: "Mueter"
      - left: "Grandfather"
        right: "Grossvater"
      - left: "Grandmother"
        right: "Grossmueter"
      - left: "Brother"
        right: "Brueder"
      - left: "Sister"
        right: "Schwöschter"
