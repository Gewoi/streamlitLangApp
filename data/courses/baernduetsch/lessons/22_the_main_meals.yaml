id: 22_the_main_meals
title: "🫕 The Main Meals and the Verb *To Eat*"
description: "Get to know the terms for the main meals: Breakfast, Lunch, Dinner, and two additional Swiss ones."
estimated_minutes: 5
section: Getting Food

steps:
  - type: introduce_word
    id: introduce_word_0
    word: "Zmorge"
    translation:
      en: "Breakfast"
      de: "Frühstück"
    images:
      - "data/assets/images/breakfast_2.jpg"
    audio: "data/assets/audio/zmorge.wav"

  - type: cloze
    id: cloze_1
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "I am eating breakfast."
      helper: "Ich esse Frühstück."
      target: ["Ig isse ", "."]
    answers: ["Zmorge"]
    solution_display: |
      ✅ Correct!
      
      *Breakfast* is **Zmorge** in Bärndütsch. We will now look at the verb **ässe** (*to eat*)!
    images:
      - "data/assets/images/breakfast.jpg"
    audio: "data/assets/audio/igissezmorge.wav"

  - type: markdown
    id: markdown_2
    markdown: |
      ## Ässe (*to eat*) in *singular*
      
      The verb **ässe** is a little bit irregular in Bärndütsch, but not wholly different from the others! The basic form is **ässe**. But the *singular* forms **start with an *i-* instead of *ä-***. You can see this in the following table:
      
      <center>
      
      | person | *to eat* | example |
      | --- | --- | --- |
      | I / Ig | **isse** | **Ig isse Zmorge** (*I eat breakfast*) |
      | Du | **issisch** | **Du issisch öppis** (*You eat something*) |
      | Är / Si / Äs | **isst** | **Si isst e Salat** (*She's eating a salad*)|
      
      </center>
      
    images:
      - "data/assets/images/guy_eating.jpg"

  - type: match
    id: match_3
    prompt: "Match the conjugations."
    pairs:
      - left: "I / Ig "
        right: "isse"
      - left: "Du"
        right: "issisch"
      - left: "Är / Si / Äs"
        right: "isst"

  - type: order
    id: order_4
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "He's eating a croissant."
      helper: "Er isst ein Croissant."
    tokens: ["Är", "isst", "es", "Gipfeli."]
    solution_display: |
      ✅ Correct!
      
      For *he eats*, we say *är isst*. And **Gipfeli** is a very typically Swiss breakfast.
    audio: "data/assets/audio/aerisstesgipfeli.wav"

  - type: translate_type
    id: translate_type_5
    prompt: "Translate the following Sentence."
    sentence:
      question: "You're eating something!"
      helper: "Du isst etwas!"
    answers:
      ["Du issisch öppis!", "Du issisch oeppis!", "Du issisch öpis!", "Du issisch oepis!"]
    images:
      - "data/assets/images/girl_eating.jpg"
    solution_display: |
      ✅ Correct!

  - type: introduce_word
    id: introduce_word_6
    word: "Zmittag"
    translation:
      en: "Lunch"
      de: "Mittagessen"
    images:
      - "data/assets/images/meal_group.jpg"
    audio: "data/assets/audio/zmittag.wav"

  - type: order
    id: order_7
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "I am eating lunch."
      helper: "Ich esse zu Mittag."
    tokens: ["Ig", "isse", "Zmittag."]
    solution_display: |
      ✅ Correct!
      
      Do you maybe already see a pattern with the meal names? It's always **Z** + **Time of Day**.
      
      - **Zmorge** -> **Z** + **Morge**
      - **Zmittag** -> **Z** + **Mittag**
      
      So, very similarly, the next one is constructed...
    audio: "data/assets/audio/igissezmittag.wav"

  - type: introduce_word
    id: introduce_word_8
    word: "Znacht"
    translation:
      en: "Dinner"
      de: "Abendessen"
    images:
      - "data/assets/images/dinner.jpg"
    audio: "data/assets/audio/znacht.wav"

  - type: cloze
    id: cloze_9
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "Are you eating dinner?"
      helper: "Isst du zu Abend?"
      target: ["Issisch du ", "?"]
    answers: ["Znacht"]
    solution_display: |
      ✅ Correct!
      
      **Znacht** means *dinner* in Bärndütsch; and it is made up the same way as the others:
      
      - **Znacht** -> **Z** + **Nacht**
    images:
      - "data/assets/images/dinner_group.jpg"
    audio: "data/assets/audio/issischduznacht.wav"

  - type: listen_type
    id: listen_type_10
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/igissezmorge.wav"
    answers: ["Ig isse Zmorge", "I isse Zmorge"]
    images:
      - "data/assets/images/breakfast.jpg"
    solution_display: |
      ✅ Correct!
      
      This means *I am eating breakfast*

  - type: match
    id: match_11
    prompt: "Match the conjugations."
    pairs:
      - left: "I / Ig"
        right: "isse"
      - left: "Du"
        right: "issisch"
      - left: "Är / Si / Äs"
        right: "isst"

  - type: markdown
    id: markdown_12
    markdown: |
      ## Ässe (*to eat*) in *plural*
      
      In the plural forms, the verb **ässe** becomes regular again!
      
      <center>
      
      | person | *to eat* | example |
      | --- | --- | --- |
      | Mir | **ässe** | **Mir ässe Zmorge** (*We eat breakfast*) |
      | Dir | **ässit** | **Dir ässit Zmittag** (*You (pl.) eat lunch*) |
      | Si | **ässe** | **Si ässe Znacht** (*They're eating dinner*)|
      
      </center>
      

  - type: match
    id: match_13
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "Mir"
        right: "ässe (*we*)"
      - left: "Dir"
        right: "ässit"
      - left: "Si"
        right: "ässe (*they*)"

  - type: order
    id: order_14
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "We eat dinner and you (pl.) eat dinner."
      helper: "Wir essen zu Abend und ihr esst zu Abend."
    tokens: ["Mir", "ässe", "Znacht", "u", "dir", "ässit", "Znacht."]
    solution_display: |
      ✅ Correct!
      
      **Znacht** means dinner, and the forms are **mir ässe** (*we eat*) and **dir ässit** (*you (pl.) eat*).
    audio: "data/assets/audio/miraesseznachtudiraessitznacht.wav"

  - type: listen_type
    id: listen_type_15
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/aessitdiroeppis.wav"
    answers: ["Ässit dir öppis?", "Aessit dir oeppis?", "Ässit dir öpis?", "Aessit dir oepis?"]
    images:
      - "data/assets/images/dinner_group.jpg"
    solution_display: |
      ✅ Correct!
      
      **Ässit dir öppis?** means *Are you (pl.) eating something?*

  - type: true_false
    id: true_false_16
    prompt: "What do you think is said?"
    audio: "data/assets/audio/siaessezmittag.wav"
    text: "This statement is about **one person**."
    answer: "False"
    solution_display: |
      ✅ Correct!
      
      **Si ässe** is about *multiple* people, as with the conjugation, **si** must mean *they*. The singular *she* would be **si *isst***.

  - type: introduce_word
    id: introduce_word_18
    word: "Znüni / Zvieri"
    translation:
      en: "Morning Snack / Afternoon Snack"
      de: ""
    images:
      - "data/assets/images/croissant.jpg"
    audio: "data/assets/audio/znueni_zvieri.wav"

  - type: markdown
    id: markdown_17
    markdown: |
      ## The Additional Meals: *Znüni* and *Zvieri*
      
      The main meals of the day are just like in any other country:
      
      - **Zmorge** (*Breakfast*)
      - **Zmittag** (*Lunch*)
      - **Znacht** (*Dinner*)
      
      But for small meals in between, we also have special names here:
      
      - **Znüni** -> **Z** + **Nüni**, and **nün** is *nine* (9)!
      	- This is a small meal in the morning hours, usually a bit after 9am, but we often take breaks for this at work or school!
      - **Zvieri** -> **Z** + **Vieri**, and **vier** means *four* (4)!
      	- This is a small meal in the afternoon hours, sometime around 4pm.
      
      These are some typically Bärndütsch terms you'll hear sometimes, so now you know what the are: Two additional meals for the day!
      
    images:
      - "data/assets/images/group_meal.jpg"

  - type: match
    id: match_19
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "Breakfast"
        right: "Zmorge"
      - left: "Lunch"
        right: "Zmittag"
      - left: "Dinner"
        right: "Znacht"
      - left: "Morning Snack"
        right: "Znüni"
      - left: "Afternoon Snack"
        right: "Zvieri"

  - type: match
    id: match_20
    prompt: "Match the conjugations."
    pairs:
      - left: "Mir"
        right: "ässe (*we)"
      - left: "Dir "
        right: "ässit"
      - left: "Si"
        right: "ässe (*they*)"

  - type: translate_type
    id: translate_type_22
    prompt: "Translate the following Sentence."
    sentence:
      question: "Breakfast, lunch and dinner."
      helper: "Frühstück, Mittagessen und Abendessen."
    answers:
      ["Zmorge, Zmittag u Znacht.", "Zmorge, Zmittag und Znacht."]
    images:
      - "data/assets/images/group_meal.jpg"
    solution_display: |
      ✅ Correct!
      
      Those are the three main meals.

  - type: cloze
    id: cloze_23
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "We are eating a morning snack."
      helper: ""
      target: ["Mir ässe ", "."]
    answers: ["Znüni", "Znueni"]
    solution_display: |
      ✅ Correct!
      
      **Znüni** is a very Swiss word for a morning snack; it literally translates to *to nine (9)*, refering to 9am (although it's usually eaten a bit after that.
    images:
      - "data/assets/images/croissant.jpg"
    audio: "data/assets/audio/miraesseznueni.wav"

  - type: order
    id: order_24
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "He's eating an afternoon snack."
      helper: ""
    tokens: ["Är", "isst", "Zvieri."]
    solution_display: |
      ✅ Correct!
      
      **Zvieri** is a common term for an afternoon snack; it literally translates to *to four (4)*, refering to 4pm.
    audio: "data/assets/audio/aerisstzvieri.wav"

  - type: match
    id: match_21
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "I / Ig"
        right: "isse"
      - left: "Du"
        right: "issisch"
      - left: "Är / Si / Äs"
        right: "isst"
      - left: "Mir "
        right: "ässe (*we*)"
      - left: "Dir"
        right: "ässit"
      - left: "Si"
        right: "ässe (*they*)"
