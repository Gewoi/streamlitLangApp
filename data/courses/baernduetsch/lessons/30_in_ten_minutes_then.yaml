id: 30_in_ten_minutes_then
title: "⏱ In Ten Minutes, Then"
description: "Talk about when you want to meet and say when you aren't available. Learn the verb **chönne** (*can*)."
estimated_minutes: 4
section: Appointments

steps:
  - type: markdown
    id: markdown_0
    markdown: |
      ## Chönne (*to be able to*)
      
      The verb **chönne** means *to be able to* or *to be available for* in Bärndütsch. You usually here it in those exact contexts:
      
      - **Är cha guet schwümme** (*He can swim well*) -> *to be able to*
      - **I cha denn** (*I am available then*) -> *to be available for*
      
      The conjugations are the following:
      
      <center>

      | pronoun (singular) | **chönne** | pronoun (plural) | **chönne** |
      | --- | --- | --- | --- |
      | I / Ig | **cha** | Mir | **chöi** | 
      | Du | **chasch** | Dir | **chöit** |
      | Är / Si / Äs | **cha** | Si | **chöi** |
      
    audio: "data/assets/audio/choenne_conjugation.wav"
    images:
      - "data/assets/images/group_run.jpg"

  - type: match
    id: match_1
    prompt: "Match the conjugations!"
    pairs:
      - left: "I / Ig"
        right: "cha (*I*)"
      - left: "Du"
        right: "chasch"
      - left: "Är / Si / Äs"
        right: "cha (*he/she/it*)"

  - type: match
    id: match_2
    prompt: "Match the conjugations!"
    pairs:
      - left: "Mir"
        right: "chöi (*we*)"
      - left: "Dir"
        right: "chöit"
      - left: "Si"
        right: "chöi (*they*)"

  - type: introduce_word
    id: introduce_word_3
    word: "denn"
    translation:
      en: "then"
      de: "dann"
    audio: "data/assets/audio/denn.wav"

  - type: order
    id: order_5
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "I am available at three."
      helper: "Ich bin frei um drei Uhr."
    tokens: ["I", "cha", "am", "drü."]
    solution_display: |
      ✅ Correct!
      
      To say that *you are available* at a certain time, you say **i cha ...**. To say *I am available then*, you'd say **I cha denn**.
    audio: "data/assets/audio/ichaamdrue.wav"

  - type: cloze
    id: cloze_4
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "Do you have time at three? - Yes, I am available then."
      helper: "Hast du um drei Uhr Zeit? - Ja, ich bin dann frei."
      target: ["Hesch du am drü Zyt? - Ja, ", "."]
    answers: ["I cha denn"]
    solution_display: |
      ✅ Correct!
      
      To say that you're free at a time, you can say **I cha denn**.
    images:
      - "data/assets/images/old_people_conv_garden.jpg"
    audio: "data/assets/audio/heschduamdruezyt_jaichadenn.wav"

  - type: translate_type
    id: translate_type_6
    prompt: "Translate the following Sentence."
    sentence:
      question: "Yes, she's available then."
      helper: "Ja, sie kann dann."
    answers: ["Ja, si cha denn."]
    images:
      - "data/assets/images/woman_painting.jpg"
    solution_display: |
      ✅ Correct!
      
      **Si cha denn** means *she's available then*.

  - type: introduce_word
    id: introduce_word_7
    word: "nid"
    translation:
      en: "not"
      de: "nicht"
    images:
      - "data/assets/images/x_sign.jpg"
    audio: "data/assets/audio/nid.wav"

  - type: markdown
    id: markdown_8
    markdown: |
      ## I cha denn nid
      
      **Nid** is also very common: It means *not*. So, if you want to say that you can't, you say **I cha *nid***. The **nid** comes after the verb and pronoun; other than that, the prefered order depends a bit on what the sentence is. But don't worry too much, you really can't make huge mistakes here, any positioning still gets the meaning across very well!
      
      - **I cha morn nid, sorry** (*I am not available tomorrow, sorry*)
      - **I cha am Dsischti nid cho** (*I can't come on Tuesday*)
      - **Är cha nid rede** (*I can't speak*)
      - **Mir chöi nid guet schwümme** (*We can't swim well*)
      
    images:
      - "data/assets/images/thumbs_down.jpg"

  - type: order
    id: order_9
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "I am not available tomorrow, sorry."
      helper: "Ich kann morgen nicht, sorry."
    tokens: ["I", "cha", "morn", "nid,", "sorry."]
    solution_display: |
      ✅ Correct!
      
      **Nid** means *not*, and **I cha** means *I am available* (in this case **i cha nid** = *I am not available*).
    audio: "data/assets/audio/ichamornnidsorry.wav"

  - type: cloze
    id: cloze_10
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "We are not available on Saturday."
      helper: "Wir können am Samstag nicht."
      target: ["", " nid."]
    answers: ["Mir chöi am Samsti", "Mir choei am Samsti", "Mir chöi am Samstig", "Mir choei am Samstig"]
    solution_display: |
      ✅ Correct! 
      
      In cases like this, the **nid** comes at the end of the sentence. In cases where you talk about an *action* that you're unable to do with a *verb*, that comes at the end: **Dir chöit nid schwümme** (*You (pl.) can't swim*), **Du chasch nid rede** (*You (sing.) can't talk*).
    images:
      - "data/assets/images/weekend_sign.jpg"
    audio: "data/assets/audio/mirchoeiamsamstinid.wav"

  - type: true_false
    id: true_false_11
    prompt: "What do you think is said?"
    audio: "data/assets/audio/ichamornnidsorry.wav"
    text: "This person is **available tomorrow**."
    answer: "False"
    solution_display: |
      ✅ Correct!
      
      They said **I cha morn nid, sorry** which means *I am not available tomorrow, sorry*.

  - type: introduce_word
    id: introduce_word_12
    word: "Minute / Minute (pl.)"
    translation:
      en: "Minute / Minutes"
      de: "Minute / Minuten"
    images:
      - "data/assets/images/clock_white.jpg"
    audio: "data/assets/audio/minute_minute.wav"

  - type: markdown
    id: markdown_14
    markdown: |
      ## Minute vs Minute
      
      **Minute** is a great example for a word that has the same singular and plural forms! Both are pronounced exactly the same and written the same.
      
      Generally: Nouns that end with **-e** (and are usually *feminine* therefore) have ***the same plural and singular forms***. Some other examples, that you don't need to remember yet but we'll look at later, are:
      
      - **Stäge** (*Stairs*)
      - **Läbe** (*Life / Lives*)
      - **Nadle** (*Needle / Needles*)
    images:
      - "data/assets/images/watch_lookat.jpg"

  - type: introduce_word
    id: introduce_word_13
    word: "Stund / Stunde"
    translation:
      en: "Hour / Hours"
      de: "Stunde / Stunden"
    images:
      - "data/assets/images/clock_spinning.jpg"
    audio: "data/assets/audio/stund_stunde.wav"

  - type: match
    id: match_16
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "minute"
        right: "Minute"
      - left: "Hour"
        right: "Stund"
      - left: "then"
        right: "denn"

  - type: introduce_word
    id: introduce_word_15
    word: "I zää Minute"
    translation:
      en: "In ten minutes"
      de: "In zehn Minuten"
    images:
      - "data/assets/images/watch_held.jpg"
    audio: "data/assets/audio/izaeminute.wav"

  - type: markdown
    id: markdown_17
    markdown: |
      ## In two hours
      
      If you want to say that something is happening *in ten minutes* (for example), the essential expression is **ih** or just **i**, which means *in*. You can simply say **i *number* minute*** (*in **number** minutes*) or **i *number* stunde** (*in **number** hours**).
      
      - **I zää minute isch guet** (*In ten minutes is good*)
      - **Är geit i füf minute** (*He goes/leaves in five minutes*)
      - **Mir hei zwöi Stund Zyt** (*We have time for two hours*)
      
      There is one notable exception: If you just have *one* minute or hour (*in one minute*, *in one hour*) then you say **ire**. This is a weird word; it comes from a familiar background though: We do not like to say similar vowels next to each other! So, instead of saying **i ei stund** or **i ä stund** or something like that, we say **ire stund** (*in one hour*).
      
      - **Si hei ire stund Zyt** (*they have time in an hour*)
      - **Mir göh ire stund Zyt** (*we leave in an hour*)
      
      The reason why we say the **r** instead of the usual **n** in this case probably have some linguistical explanation, but probably the easiest way to think of it is that it's based on the German expression *in einer Stunde*. 
      
      There are a few different ways of saying **ire stund** (like **i eire Stund**, **inere Stund**), all of which are based on the same principle of not saying similar vowels after one another; but here, we'll focus on **ire stund** (*in an hour*).
    images:
      - "data/assets/images/numbers.jpg"

  - type: choose
    id: choose_18
    prompt: "How would you say **in ten minutes**?"
    images:
      - "data/assets/images/clocks.jpg"
    single_answer: true
    correct_answers: ["I zää Minute"]
    wrong_answers: ["Ire zää Minute", "I zää Stund", "Ire zää Stunde"]
    solution_display: |
      ✅ Correct!
      
      The general form to say *in **number** minutes* is **i *number* minute**; the only exception is *one* -> **Ire Minute**. But for *in ten minutes*, it is **i zää minute**.

  - type: translate_type
    id: translate_type_19
    prompt: "Translate the following Sentence."
    sentence:
      question: "We leave in six minutes."
      helper: "Wir gehen in sechs Minuten."
    answers: ["Mir göh i sächs Minute.", "Mir goeh i saechs Minute."]
    images:
      - "data/assets/images/woman_waving_two.jpg"
    solution_display: |
      ✅ Correct!
      
      **I sächs Minute** means *in six minutes*.

  - type: true_false
    id: true_false_20
    prompt: "What do you think is said?"
    audio: "data/assets/audio/wenngeischdu_irestund.wav"
    text: "This asked person will leave **in one hour**."
    answer: "True"
    solution_display: |
      ✅ Correct!
      
      They were asked **Wenn geisch du?** (*When are you going?*) and they replied with **Ire Stund** (*in one hour*). Note that the one exception from the rule **i *number* stunde** is *in one hour*, for that we use **Ire Stund**.

  - type: order
    id: order_21
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "He is here in two hours."
      helper: "Er ist in zwei Stunden hier."
    tokens: ["Är", "isch", "i", "zwöi", "Stunde", "hie."]
    solution_display: |
      ✅ Correct!
      
      Note that often in Bärndütsch, you'll hear people actually say **i zwöi Stund** instead of **i zwöi Stunde**. Both is correct! We'll focus on the case that's a bit closer to Hochdeutsch.
    audio: "data/assets/audio/aerischizwoeistundehie.wav"

  - type: listen_type
    id: listen_type_22
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/irestundischnueni.wav"
    answers: ["Ire Stund isch nüni.", "Ire Stund isch nueni."]
    images:
      - "data/assets/images/watch_lookat3.jpg"
    solution_display: |
      ✅ Correct!
      
      This means *In one hour it's nine o'clock* (or, more literally, *in one hour is nine*).

  - type: cloze
    id: cloze_23
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "Is in five minutes good? - Yes, I am available then."
      helper: "Ist in fünf Minuten gut? - Ja, ich kann dann."
      target: ["Isch ", " guet? - Ja, i cha denn."]
    answers: ["i füf Minute", "i fuef Minute"]
    solution_display: |
      ✅ Correct!
      
      **I füf Minute** means *in five minutes*. **I cha denn** means *I am available then*.
    images:
      - "data/assets/images/thumbs_up.jpg"
    audio: "data/assets/audio/ischifuefminuteguet_jaichadenn.wav"

  - type: translate_type
    id: translate_type_25
    prompt: "Translate the following Sentence."
    sentence:
      question: "I can't in ten minutes / I am not available in ten minutes."
      helper: "Ich kann nicht in zehn Minuten."
    answers: ["I cha nid i zää minute.", "I cha i zää minute nid."]
    images:
      - "data/assets/images/thumbs_down.jpg"
    solution_display: |
      ✅ Correct!
      
      **Nid** means *not*, and **i zää minute** means *in ten minutes*.

  - type: match
    id: match_26
    prompt: "Match the conjugations."
    pairs:
      - left: "I"
        right: "cha (*I*)"
      - left: "Du"
        right: "chasch"
      - left: "Är / Si / Äs"
        right: "cha (*he/she/it*)"
      - left: "Mir"
        right: "chöi (*we*)"
      - left: "Dir"
        right: "chöit"
      - left: "Si"
        right: "chöi (*they*)"

  - type: match
    id: match_24
    prompt: "Match the translations (English → Bärndütsch)."
    pairs:
      - left: "then"
        right: "denn"
      - left: "minute(s)"
        right: "Minute"
      - left: "hour(s)"
        right: "Stund / Stunde"
      - left: "in ten minutes"
        right: "i zää Minute"
      - left: "in an hour"
        right: "ire Stund"
      - left: "not"
        right: "nid"
