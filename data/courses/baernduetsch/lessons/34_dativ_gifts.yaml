id: 34_dativ_gifts
title: "😌 Dativ: Gifts"
description: "Learn about another one of the cases, the *Dativ*, and learn the verb **gää** (*to give*)."
estimated_minutes: 7
section: People

steps:
  - type: markdown
    id: markdown_0
    markdown: |
      ## The cases
      
      Now, we'll add the last of the cases that is important in **Bärndütsch**! You've already seen:
      
      -**Nominative**: *takes* the action (*subject*)
      -**Accusative**: *recieves* the action, is the *target* of the action (*direct* object)
      
      There is **one more** case that is relevant for Bärndütsch:
      
      - **Dative**: *to* or *for* who/what the action is taken (*indirect* object)
      
      This might seem a bit confusing at first so we'll explore it step by step!
      
    images:
      - "data/assets/images/guy_wondering.jpg"

  - type: markdown
    id: markdown_1
    markdown: |
      ## A simple example
      
      Look at the followig Sentence
      
      <center> My brother gives me his car</center>
      
      You know that here, *his car* is in the *accusative*: It's the *target* of the action of **giving**. 
      
      The car is *given* ***to*** Lena. Therefore, **me** is in *Dativ*! This is the most important use for the Dativ: Someone or something that isn't recieving the action *itself*, but rather someone or something that recieves the consequences of the action.
      
      In Bärndütsch, this sentence would be:
      
      <center> **Mi Bruder git *mir* sis Outo** </center>
      
      You've already seen this in **Wi geits dir?** (*How are you?*). The **Dir** isnt' *you (pl.)* here, it's actually the **Du** in *Dativ*! If you can reasonably add a *to* in front of the English translation of it (*gives **to** me*), then usually it will be in *Dativ* in German.
      
      We'll look at the individual words and forms of this sentence during this lesson!
      
    images:
      - "data/assets/images/car_keys_pass.jpg"

  - type: order
    id: order_2
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "My brother gives me his car."
      helper: "Mein Bruder gibt mir sein Auto."
    tokens: ["Mi", "Brueder", "git", "mir", "sis", "Outo."]
    solution_display: |
      ✅ Correct!
      
      **Mi Brueder** is *my brother*, **(är) git** means *(he) gives* and **sis Outo** is *his car*. The **mir** is the Dativ form of first person singular; *me* isn't the target of the action of *giving*, but the one that it is given *to*!
    audio: "data/assets/audio/mibruedergitmirsisouto.wav"

  - type: introduce_word
    id: introduce_word_3
    word: "Ds Outo"
    translation:
      en: "The car"
      de: "Das Auto"
    images:
      - "data/assets/images/car1.jpg"
    audio: "data/assets/audio/dsouto.wav"

  - type: cloze
    id: cloze_4
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "She gives me her car."
      helper: "Sie gibt mir ihr Auto."
      target: ["Si git mir ", "."]
    solution_display: |
      ✅ Correct!
      
      **Outo** is *neuter*, so we use **ihres**. Again, the **mir** here is the *Dativ* of **I / Ig**!
    images:
      - "data/assets/images/couple_carkey.jpg"
    audio: "data/assets/audio/sigitmirihresouto.wav"

  - type: order
    id: order_5
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "My father has a car."
      helper: "Mein Vater hat ein Auto."
    tokens: ["Mi", "Vater", "hett", "es", "Outo."]
    solution_display: |
      ✅ Correct!
      
      Now, let's look at the verb **gää** (*to give*) and some *Dativ* forms!
    audio: "data/assets/audio/mivaterhettesouto.wav"

  - type: markdown
    id: markdown_6
    markdown: |
      ## **Gää** + *Dativ*
      
      Let's look at the *singular* forms of the verb **gää** (*to give*), and combine them with the singular *Dativ* forms!
      
      <center>
      
      | pronoun | **gää** | dativ pronoun |
      | --- | --- | --- |
      |I / Ig | **gibe** | **mir** |
      | Du | **gisch** | **dir** |
      | Är | **git** | **ihm** |
      | Si | **git** | **ihre** |
      
      When you use **gää**, whoever receives the thing that's given is in Dativ! Some examples:
      
      - **I gibe dir es Huus** (*I give you a house*)
      - **Mini Mueter git mir e Pflanze** (*My mother gives me a plant*)
      - **Si git ihm zwöi Stund** (*She gives him to hours*)
      - **Är git ihre nüt** (*He gives her nothing*)
      
    images:
      - "data/assets/images/giving_gift.jpg"

  - type: match
    id: match_7
    prompt: "Match the cojugations of **gää**."
    pairs:
      - left: "I / Ig"
        right: "gibe"
      - left: "Du"
        right: "gisch"
      - left: "Är / Si / Äs"
        right: "git"

  - type: match
    id: match_8
    prompt: "Match the *Dativ* pronouns!"
    pairs:
      - left: "I / Ig"
        right: "Mir"
      - left: "Du"
        right: "Dir"
      - left: "Är"
        right: "Ihm"
      - left: "Si"
        right: "Ihre"

  - type: order
    id: order_9
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "You give him your car."
      helper: "Du gibst ihm dein Auto."
    tokens: ["Du", "gisch", "ihm", "dis", "Outo."]
    solution_display: |
      ✅ Correct!
      
      **Du gisch** means **you give**, and **ihm** is the *Dativ* form of **Är**.
    audio: "data/assets/audio/dugischihmdisouto.wav"

  - type: cloze
    id: cloze_10
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "She gives me her car tomorrow."
      helper: "Sie gibt mir morgen ihr Auto."
      target: ["", " ihres Outo."]
    answers: ["Si git mir"]
    solution_display: |
      ✅ Correct!
      
      **Si git mir** means **she gives (to) me**. Remember, if you can add a *to* in the English sentence before the pronoun, we usually use *Dativ* in Bärdütsch!
    images:
      - "data/assets/images/couple_carkey.jpg"
    audio: "data/assets/audio/sigitmirmornihresouto.wav"

  - type: choose
    id: choose_11
    prompt: "**I gibe** ___ **e Suppe**."
    images:
      - "data/assets/images/soup.jpg"
    single_answer: true
    correct_answers: ["ihm"]
    wrong_answers: ["ihre", "är", "ihn"]
    solution_display: |
      ✅ Correct!
      
      The *Dativ* of **är** is **ihm**. **E Suppe** means *a soup*.
    audio: "data/assets/audio/igibeihmesuppe.wav"

  - type: listen_type
    id: listen_type_12
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/sigitmirnuet.wav"
    answers: ["Si git mir nüt", "Si git mir nuet."]
    images:
      - "data/assets/images/x_sign.jpg"
    solution_display: |
      ✅ Correct!
      
      This means *she gives me nothing*.

  - type: introduce_word
    id: introduce_word_13
    word: "Gäld"
    translation:
      en: "Money"
      de: "Geld"
    images:
      - "data/assets/images/swissfranc.jpg"
    audio: "data/assets/audio/gaeld.wav"

  - type: cloze
    id: cloze_14
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "I give him money."
      helper: "Ich gebe ihm Geld."
      target: ["I gibe ", "."]
    answers: ["ihm Gäld", "ihm Gaeld"]
    solution_display: |
      ✅ Correct!
      
      **Ihm** is the *Dativ* of **ar**, and **Gäld** means *money*. **Gäld** does have an article (**Ds Gäld**, *neuter*), but it's often used without an article.
    images:
      - "data/assets/images/swissfranc_give.jpg"
    audio: "data/assets/audio/igibeihmgaeld.wav"

  - type: translate_type
    id: translate_type_15
    prompt: "Translate the following Sentence."
    sentence:
      question: "He gives me money!"
      helper: "Er gibt mir Geld!"
    answers: ["Är git mir Gäld!", "Aer git mir Gaeld!"]
    images:
      - "data/assets/images/swissfranc.jpg"
    solution_display: |
      ✅ Correct!

  - type: order
    id: order_16
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "You give her money and she gives you a car."
      helper: "Du gibst ihr Geld und sie gibt dir ein Auto."
    tokens: ["Du", "gisch", "ihre", "Gäld", "u", "si", "git", "dir", "es", "Outo."]
    solution_display: |
      ✅ Correct!
    audio: "data/assets/audio/dugischihregaeld_sigitdiresouto.wav"

  - type: match
    id: match_17
    prompt: "Match the conjugations."
    pairs:
      - left: "I / Ig"
        right: "gibe"
      - left: "Du"
        right: "gisch"
      - left: "Är / Si / Äs"
        right: "git"

  - type: match
    id: match_18
    prompt: "Match the dativ cases."
    pairs:
      - left: "I / Ig"
        right: "Mir"
      - left: "Du"
        right: "Dir"
      - left: "Är"
        right: "Ihm"
      - left: "Si"
        right: "Ihre"

  - type: markdown
    id: markdown_19
    markdown: |
      ## **Gää** + *Dativ*: Plural
      
      Now, let's look at the *plural* forms and their *Dativ* cases!
      
      <center>
      
      | pronoun | **gää** | dativ pronoun |
      | --- | --- | --- |
      | Mir | **gäbe / gäh** | **üs** |
      | Dir | **gäbit / gäbet / gäht** | **öich** |
      | Si | **gäbe / gäh** | **ihne** |
      
      </center>
      
      For all of them, there are two forms: One with **gäbe** and one with **gäh**. Both are always correct, although generally the **gäh** version is a bit more common.
      
      Some examples:
      - **Si gäh üs nüt** (*They give us nothing*)
      - **Mir gäh öich es huus** (*We give you a house*)
      - **Dir gäht ihne öii Pflanze** (*You (pl) give them your plant/s*)
    images:
      - "data/assets/images/family_big_dinner.jpg"

  - type: order
    id: order_20
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "You (pl.) give us nothing!"
      helper: "Ihr gebt uns nichts!"
    tokens: ["Dir", "gäbit", "üs", "nüt!"]
    solution_display: |
      ✅ Correct!
      
      The *Dativ* of **mir** (*we*) is **üs**. You could say **dir gäbit** or **dir gäht**, both work.
    audio: "data/assets/audio/dirgaebituesnuet.wav"

  - type: choose
    id: choose_21
    prompt: "Choose all *plural Dativ* forms."
    images:
      - "data/assets/images/group_back_beach.jpg"
    single_answer: false
    correct_answers: ["üs", "öich", "ihne"]
    wrong_answers: ["dir", "mir", "si"]
    solution_display: |
      ✅ Correct!
      
      The plural forms are:
      - **mir** (*we*) -> **üs**
      - **dir** (*you (pl)*) -> **öich**
      - **si**  (*they*) -> **ihne**

  - type: cloze
    id: cloze_22
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "Your parents give us two plants."
      helper: "Eure Eltern geben uns zwei Pflanzen."
      target: ["Öii Eltere ", " zwöi  Pflanze."]
    answers: ["gäbe üs", "gäh üs"]
    solution_display: |
      ✅ Correct!
      
      For **si** (*they*), you can use **gäbe** or **gäh**. The *Dativ* of **mir** (*we*) is **üs**.
    images:
      - "data/assets/images/plant_1.jpg"
    audio: "data/assets/audio/oeiielteregaebeueszwoeipflanze.wav"

  - type: listen_type
    id: listen_type_23
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/mirgaebeihnegaeld.wav"
    answers: ["Mir gäbe ihne gäld", "mir gäh ihne gäld", "mir gaebe ihne gaeld", "mir gaeh ihne gaeld"]
    images:
      - "data/assets/images/swissfranc_give.jpg"
    solution_display: |
      ✅ Correct!
      
      The *Dativ* of **si** (*they*) is **ihne**.

  - type: true_false
    id: true_false_24
    prompt: "What do you think is said?"
    audio: "data/assets/audio/dirgaebituesnuet.wav"
    text: "They're saying: "You give **us** nothing!""
    answer: "True"
    solution_display: |
      ✅ Correct!
      
      The *Dativ* of **mir** (*we*) is **üs** (kind of similar to the English *us*).

  - type: match
    id: match_25
    prompt: "Match the conjugations."
    pairs:
      - left: "Mir"
        right: "gäbe / gäh (*we*)"
      - left: "Dir "
        right: "gäbit / gäht"
      - left: "Si"
        right: "gäbe /gäh (*they*)"

  - type: match
    id: match_26
    prompt: "Match the Dativ forms!"
    pairs:
      - left: "I / Ig"
        right: "mir"
      - left: "Du"
        right: "dir"
      - left: "Är"
        right: "ihm"
      - left: "Si  (*she*)"
        right: "ihre"
      - left: "Mir"
        right: "üs"
      - left: "Dir"
        right: "öich"
      - left: "Si (*they*)"
        right: "ihne"
