  - type: introduce_word
    id: introduce_word_15
    word: "Zwöi mal pro Wuche"
    translation:
      en: "Two times per week"
      de: "Zwei mal pro Woche"
    images:
      - "data/assets/images/two_fingers.jpg"
    audio: "data/assets/audio/zwoeimalprowuche.mp3"

  - type: markdown
    id: markdown_16
    markdown: |
      ## How many times per day, week, month, year?
      
      The form for expressing *how often* you do an activity that you do *regularly* (like swimming twice a week, exercising once per day, etc.) is mostly simple:
      
      ***Number*** + **Mal** + **pro**.
      
      **Mal** literally means *times* (both in the occurence as well as the mathematical sense). **Pro** translates to *per* in English.
      
      So, if you want to say that you go swimming twice a week, you'd say:
      
      **I gah zwöi mal pro Wuche gah schwümme**.
      
      You can use **pro** for any of these time units (**pro Tag**, **pro Wuche**, **pro Monet**, **pro Jahr**), so it's the easiest to learn and we'll focus on that here! You could technically also say **zwöi Mal *ir* Wuche**, **drü Mal *im* Jahr**, etc. This roughly translates roughly to *in the week*, *in the year*, etc. You'll often also hear this, so be aware of it; but to express yourself using **pro** is perfect!
      
      There is one exception: If you do something *once* per day, week, month, year, you usually use **einisch** instead of **eis Mal** (although both are correct).
      
      Examples:
      
      - *I go swimming once a week* -> **I gah *einisch pro* Wuche gah schwümme**
      - *You play volleyball once a month* -> **Du spilsch *einisch pro* Monet Volleyball**
      - *She eats three times a day* -> **Si isst *drü Mal pro* Tag**
      - *We go hiking two times a year* -> **Mir göh *zwöi Mal pro* Jahr gah wandere**
    images:
      - "data/assets/images/writing.jpg"

  - type: choose
    id: choose_17
    prompt: "How often does this person go hiking?"
    images:
      - "data/assets/images/hike_solo.jpg"
    single_answer: false
    correct_answers: ["Twice a year."]
    wrong_answers: ["Three times a month.", "Once a week."]
    solution_display: |
      ✅ Correct!
      
      They are saying **I gah zwöi mal pro Jahr gah wandere**, which means *I go hiking two times a year*.
    audio: "data/assets/audio/igahzwoeimalprojahrgahwandere.mp3"

  - type: cloze
    id: cloze_18
    prompt: "Fill in the missing words (answer in Bärndütsch)."
    sentence:
      question: "I knit once per day."
      helper: "Ich stricke einmal am Tag."
      target: ["I lisme ", "."]
    answers: ["einisch pro Tag", "eis Mal pro Tag"]
    solution_display: |
      ✅ Correct!
      
      To say *once a day*, you usually say **einisch pro Tag**. You can also say **eis Mal pro Tag**, but the first is more common.
    images:
      - "data/assets/images/knitting.jpg"
    audio: "data/assets/audio/ilismeeinischprotag.mp3"

  - type: cloze
