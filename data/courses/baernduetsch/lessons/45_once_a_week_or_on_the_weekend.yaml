    sentence:
      question: "One month, two months, three months."
      helper: "Ein Monat, zwei Monate, drei Monate."
    tokens: ["Ei Monet,", "zwöi Mönet,", "drü Mönet."]
    solution_display: |
      ✅ Correct!
      
      Similar to before with **Tag**, the *plural* of **Monet** is **Mönet**!
    audio: "data/assets/audio/eimonetzwoeimoenetdruemoenet.mp3"

