id: 45_once_a_week_or_on_the_weekend
title: "Once a Week or on the Weekend"
description: "Say how often you do an activity, and learn about expressions for *week*, *month*, *year*, and others. "
estimated_minutes: 4
section: Hobbies

steps:
  - type: introduce_word
    id: introduce_word_0
    word: "D Wuche"
    translation:
      en: "The week"
      de: "Die Woche"
    images:
      - "data/assets/images/calendar_week.jpg"
    audio: "data/assets/audio/wuche.mp3"

  - type: order
    id: order_1
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "One week, two weeks, three weeks."
      helper: "Eine Woche, zwei Wochen, drei Wochen."
    tokens: ["Ei Wuche,", "zwöi Wuche,", "drü Wuche."]
    solution_display: |
      ✅ Correct!
      
      Remember: We use **ei** for *masculine* and *feminine* nouns and **eis** for *neuter* nouns. Also, note that the *plural* form of **Wuche** is also just **Wuche** in Bärndütsch, which makes it a bit easier!
    audio: "data/assets/audio/eiwuchezwoeiwuchedruewuche.mp3"

  - type: introduce_word
    id: introduce_word_2
    word: "Tag"
    translation:
      en: "Day"
      de: "Tag"
    images:
      - "data/assets/images/sky.jpg"
    audio: "data/assets/audio/tag.mp3"

  - type: order
    id: order_3
    prompt: "Put the words in the correct order (Bärndütsch)."
    sentence:
      question: "A week has seven days."
      helper: "Eine Woche hat sieben Tage."
    tokens: ["Ä", "Wuche", "hett", "sibe", "Täg."]
    solution_display: |
      ✅ Correct!
      
      Note here: The singular of *day* is **Tag**. The plural form *days* however is **Täg** (with an *ä*). You'll see this pattern sometimes in Bärndütsch that the plural form switches the middle vowel to an *ä*, *ö* or *ü*.
    audio: "data/assets/audio/ewuchehettsibetaeg.mp3"

  - type: listen_type
    id: listen_type_4
    prompt: "Listen and type what you hear (Bärndütsch)."
    audio: "data/assets/audio/ewucheuetag.mp3"
    answers: ["E wuche u e tag", "ä wuche u ä tag", "e wuche und e tag", "ä wuche und e tag"]
    images:
      - "data/assets/images/calendar_circles.jpg"
    solution_display: |
      ✅ Correct!
      
      This means *a week and a day*.

  - type: introduce_word
