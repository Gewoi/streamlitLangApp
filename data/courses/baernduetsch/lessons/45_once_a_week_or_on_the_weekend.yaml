      helper: "Ich putze das Haus zwei mal pro Monat."
      target: ["I putze ds Huus ", "."]
    answers: ["zwöi Mal pro Monet", "zwoei Mal pro Monet"]
    solution_display: |
      ✅ Correct!
    images:
