      helper: "Ich spiele einmal pro Woche Volleyball."
    tokens: ["I", "spile", "einisch", "pro", "Wuche", "Volleyball."]
    solution_display: |
      ✅ Correct!
    audio: "data/assets/audio/isplieeinischprowuchevolleyball.mp3"

