    sentence:
      question: "For one month."
      helper: "Für einen Monat."
      target: ["Für ei ", "."]
    solution_display: |
      ✅ Correct!
    images:
      - "data/assets/images/watch_held.jpg"
    audio: "data/assets/audio/fuereimonet.mp3"

  - type: introduce_word
