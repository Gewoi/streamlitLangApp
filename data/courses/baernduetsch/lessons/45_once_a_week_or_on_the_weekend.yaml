      helper: "Ein Jahr oder zwei Jahre?"
      target: ["", " oder zwöi Jahr?"]
    answers: ["Eis Jahr"]
    solution_display: |
      ✅ Correct!
      
      Remember: For *neuter* nouns we use **eis** instead of **ei** to say *one*. The *plural* of **Jahr** is also just **Jahr** again!
    images:
      - "data/assets/images/woman_asking.jpg"
    audio: "data/assets/audio/eisjahroderzwoeijahr.mp3"

